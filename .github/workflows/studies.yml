name: studies (hourly)
# «آخر الدراسات»: كل دراسات 2026 لليوم + الجديد. كل ساعة بيشتغل 55 دقيقة وبيدق /api/studies/tick كل 20 ثانية:
# كل دقة بتلخّص كم دراسة بـ Gemini. إذا Gemini قال خلص الحد، الموقع بيستنى لحالو. لما تخلص كل الدراسات، الدقة بترجع فاضية.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency: { group: studies, cancel-in-progress: false }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - run: |
          end=$(( $(date +%s) + 55*60 ))
          while [ $(date +%s) -lt $end ]; do
            r=$(curl -sS -m 40 "https://ko-sport.online/api/studies/tick?t=$(date +%s)" || true)
            echo "$(date +%H:%M:%S) $r" | head -c 300; echo
            case "$r" in *'"done":1'*) sleep 300;; *wait*) sleep 60;; *) sleep 15;; esac
          done
