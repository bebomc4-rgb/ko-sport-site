name: studies (hourly)
# «آخر الدراسات» بمكتبة التمارين: كل ساعة منفتح القسم مرة، فالموقع بيدوّر على دراسات جديدة بـ PubMed وبيلخّصها بالعربي
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 30 "https://ko-sport.online/api/studies?t=$(date +%s)" | head -c 300; echo
