name: probe
on:
  push:
    branches: [master]
    paths: [".github/probe-request"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://ko-sport.online
          echo "== sw:"; curl -sS -m 20 "$S/sw.js?x=$(date +%s)" | grep -oE 'ko-v[0-9]+' | head -1
          echo "== store.js:"; curl -sS -m 20 "$S/assets/store.js?v=448" | grep -oE 'waBeacon|gateRetry|data-vreg-off' | sort -u | tr '\n' ' '; echo
          echo "== me (no login):"; curl -sS -m 20 "$S/api/acct/me"; echo
          N=probe$(date +%s)xxxxxxxxxxxx; T=$(head -c 64 /dev/urandom | tr -dc 'A-HJ-NP-Z2-9' | head -c 6)
          echo "== wa-start (login) $T:"; curl -sS -m 20 -H 'content-type: text/plain' -d "{\"login\":true,\"t\":\"$T\",\"n\":\"$N\"}" "$S/api/acct/wa-start"; echo
          echo "== wa-start again:"; curl -sS -m 20 -H 'content-type: application/json' -d "{\"login\":true,\"t\":\"$T\",\"n\":\"$N\"}" "$S/api/acct/wa-start"; echo
          echo "== wa-check:"; curl -sS -m 20 -H 'content-type: application/json' -d "{\"t\":\"$T\",\"n\":\"$N\"}" "$S/api/acct/wa-check"; echo
          echo "== wa-check other device:"; curl -sS -m 20 -H 'content-type: application/json' -d "{\"t\":\"$T\",\"n\":\"otherdevicexxxxxxxxxx\"}" "$S/api/acct/wa-check"; echo
          echo "== wa-done unknown:"; curl -sS -m 20 -H 'content-type: application/json' -d '{"t":"ZZZZZ9"}' "https://ko-sport.pages.dev/api/acct/wa-done"; echo
          echo "== diag auth:"; curl -sS -m 30 "$S/api/diag" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"build": d.get("build"), "auth": d.get("auth"), "authError": d.get("authError")}, ensure_ascii=False))'
