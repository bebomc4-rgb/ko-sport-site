name: probe
on:
  push:
    branches: [master]
    paths: [".github/probe-request"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          S=https://ko-sport.online
          echo "== sw:"; curl -sS -m 20 "$S/sw.js?x=$(date +%s)" | grep -oE 'ko-v[0-9]+' | head -1
          echo "== studies:"; curl -sS -m 30 "$S/api/studies?p=0&t=$(date +%s)" | python3 -c 'import json,sys; d=json.load(sys.stdin); L=d.get("list",[]); print("total",d.get("total"),"more",d.get("more"),"at",d.get("at"),"err",d.get("err")); [print(" -", x.get("d"), x.get("m"), x.get("ja"), "|", x.get("t")) for x in L[:5]]'
