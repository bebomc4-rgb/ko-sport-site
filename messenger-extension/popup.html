<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"></head>
<body class="pop">
<div class="wrap">
  <div class="row" style="justify-content:space-between"><h1 style="font-size:17px">🤖 رفيق المسنجر</h1><span id="state" class="pill">…</span></div>
  <div class="card">
    <p class="hint" id="conn">عم اتصل بالمجيب…</p>
    <label class="chk"><input type="checkbox" id="on"> البوت شغّال</label>
    <select id="mode"><option value="draft">بيكتب الرد بس (إنت بتبعت)</option><option value="send">بيرد وبيبعت لحالو</option></select>
    <p class="hint" id="tab">…</p>
    <div class="row"><button class="btn" id="opts">الإعدادات والتحكم (بالمجيب)</button><button class="btn ghost" id="diag">فحص صفحة المسنجر</button></div>
    <div class="out" id="diagOut" style="display:none;font-size:12px"></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">آخر شي صار</h2><button class="btn ghost small" id="clear">مسح</button></div>
    <div class="log" id="log"><small class="hint">لسا ما صار شي</small></div>
  </div>
  <details class="hint"><summary>متقدم</summary>
    <label class="f" style="margin-top:6px">عنوان المجيب على الكمبيوتر<input type="text" id="server" dir="ltr"></label>
  </details>
</div>
<script src="settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
