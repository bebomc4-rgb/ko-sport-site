<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>التمرين التفاعلي | KO SPORT</title>
<script>try{var t=localStorage.getItem("ko_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
/* نفس هوية المتجر (متل صفحة التوقعات): أبيض/كريمي، حبر غامق، لمسات ذهبية، أزرار سودا، ووضع ليلي من ko_theme */
:root{--bg:#ffffff;--hdr:#fdfbf7;--txt:#100f14;--ink:#100f14;--muted:#5f5c56;--line:#e4e0d8;--card:#ffffff;--card2:#f7f5f0;
  --gold:#c9a45c;--gold2:#a8843f;--goldbg:#fbf6ea;--btn:#100f14;--btnfg:#ffffff;
  --red:#c62828;--orange:#c9a45c;--green:#1f8f4e;--blue:#2f6fb3;--r:14px;
  --shadow:0 1px 0 rgba(201,164,92,.3) inset,0 14px 34px -18px rgba(0,0,0,.35);--figbg:#f7f5f0;color-scheme:light}
html[data-theme=dark]{--bg:#0f0f12;--hdr:#141418;--txt:#f2f2f5;--ink:#f2f2f5;--muted:#a4a4af;--line:#2c2c34;--card:#1a1a20;--card2:#22222a;
  --goldbg:#2a2416;--btn:#f2f2f5;--btnfg:#100f14;--green:#3ec47a;--red:#ef5350;--blue:#64a8ff;--figbg:#141418;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55}
.wrap{max-width:1100px;margin:auto;padding:16px 14px 80px}
.back{display:none;margin-bottom:12px;color:var(--gold2);font-weight:700;text-decoration:none}
body.full .back{display:inline-block}

/* العنوان */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin:2px 0 16px}
.eyebrow{display:inline-block;background:var(--goldbg);color:var(--gold2);border:1px solid var(--gold);border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:700;margin-bottom:8px}
h1{font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.3;letter-spacing:-.2px}
h1 span{color:var(--gold2)}
.stats{display:flex;gap:8px}
.stat{background:linear-gradient(135deg,var(--goldbg),var(--card) 70%);border:1px solid var(--gold);border-radius:var(--r);padding:8px 14px;text-align:center;min-width:76px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.4rem;color:var(--gold2);line-height:1.2}
.stat small{color:var(--muted);font-size:.75rem}

/* الفلاتر (متل chips التوقعات) */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:7px 15px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.active{background:var(--btn);color:var(--btnfg);border-color:var(--btn);font-weight:700}

/* البطاقات */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:1px solid rgba(201,164,92,.55);border-radius:var(--r);padding:14px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card.done{border-color:var(--green)}
.card.done .badge-done{display:flex}
.fig{position:relative;height:180px;margin:-14px -14px 12px;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at 50% 35%,var(--goldbg),var(--figbg) 70%)}
.fig svg{width:100%;height:100%;display:block}
.fig .tag{position:absolute;top:10px;right:10px;z-index:2}
.fig .ico{position:absolute;top:8px;left:10px;font-size:20px;z-index:2}
.tag{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--goldbg);color:var(--gold2);border:1px solid var(--gold)}
.card h3{font-size:1.1rem;font-weight:800;margin-bottom:2px}
.card p{color:var(--muted);font-size:.85rem;line-height:1.6;min-height:42px}
.meta{display:flex;gap:6px;margin:12px 0}
.meta div{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.meta b{display:block;font-size:1rem}
.meta small{color:var(--muted);font-size:.7rem}
.level{display:flex;gap:4px;margin-bottom:12px}
.level i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.level i.on{background:var(--gold)}
.btn{width:100%;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;background:var(--btn);color:var(--btnfg);min-height:48px}
.btn:active{transform:scale(.98)}
.badge-done{display:none;position:absolute;top:10px;left:40px;z-index:3;background:var(--green);color:#fff;font-weight:700;font-size:.72rem;padding:3px 10px;border-radius:99px;align-items:center}

/* نافذة المؤقت (متل نافذة الإحصائيات: بلور ورا) */
.overlay{position:fixed;inset:0;background:rgba(16,15,20,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.overlay.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.timer{background:var(--card);border:1px solid var(--gold);border-radius:20px;width:100%;max-width:430px;padding:22px 18px 18px;text-align:center;position:relative;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);max-height:calc(100vh - 28px);overflow:auto}
.timer.work{box-shadow:0 0 0 2px var(--red),0 30px 80px -20px rgba(0,0,0,.45)}
.timer.rest{box-shadow:0 0 0 2px var(--blue),0 30px 80px -20px rgba(0,0,0,.45)}
.timer.finish{box-shadow:0 0 0 2px var(--green),0 30px 80px -20px rgba(0,0,0,.45)}
.close{position:absolute;top:12px;left:12px;z-index:4;background:var(--card2);border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px}
.phase{font-weight:800;font-size:.9rem;margin-bottom:2px}
.t-name{font-size:1.25rem;font-weight:800}
.t-set{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.t-fig{height:160px;margin:4px auto 0;max-width:260px;border-radius:14px;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 35%,var(--goldbg),var(--figbg) 70%)}
.t-fig svg{width:100%;height:100%}
.ring{position:relative;width:240px;height:240px;transform:scale(.78);margin:-18px auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.sub{color:var(--muted);font-size:.85rem;margin-top:6px}
.tip{background:var(--goldbg);border:1px solid rgba(201,164,92,.5);border-radius:12px;padding:9px 12px;color:var(--ink);font-size:.82rem;margin:8px 0 14px}
.controls{display:flex;gap:8px}
.controls button{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:11px 6px;font:inherit;font-weight:700;cursor:pointer;min-height:48px}
.controls .primary{background:var(--btn);color:var(--btnfg);border-color:var(--btn);flex:2}
.controls .repdone{background:var(--green);color:#fff;border:0;flex:2;display:none}
.flash{animation:flash .5s}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--btn);color:var(--btnfg);padding:11px 20px;border-radius:12px;font-weight:700;z-index:60;transition:.3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* الكاميرا */
.timer.cam{max-width:960px}
.t-body{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.timer.cam .t-body{grid-template-columns:1.35fr 1fr}
.cam-panel{display:none;text-align:right}
.timer.cam .cam-panel{display:block}
.timer.cam .t-fig{display:none}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;border:1px solid var(--gold)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.stage.file video,.stage.file canvas{transform:none}
.stage .loading{position:absolute;inset:0;z-index:3;background:var(--card);color:var(--ink);display:grid;place-items:center;font-weight:600;text-align:center;padding:18px}
.fb{position:absolute;left:10px;right:10px;bottom:10px;padding:9px 12px;border-radius:12px;font-weight:800;font-size:.95rem;background:rgba(255,255,255,.92);color:#100f14;border:1px solid var(--gold);text-align:center;transition:.2s}
.fb.good{border-color:#1f8f4e;color:#1f8f4e}
.fb.bad{border-color:#c62828;color:#c62828}
.fb.warn{border-color:var(--gold);color:#a8843f}
.live{position:absolute;top:10px;right:10px;background:#c62828;color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;letter-spacing:1px}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cstats div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.cstats b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.cstats small{color:var(--muted);font-size:.75rem}
.cstats .g b{color:var(--green)} .cstats .r b{color:var(--red)}
.cam-row{display:flex;gap:8px;margin-top:10px}
.cam-row button,.cam-btn{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:11px;font:inherit;font-weight:700;cursor:pointer;min-height:46px}
.cam-btn{display:block;width:100%;margin-top:10px;background:var(--btn) !important;color:var(--btnfg) !important;border:0 !important;text-align:center;text-decoration:none}
.cam-btn.alt{background:var(--card2) !important;color:var(--ink) !important;border:1px solid var(--line) !important}
.timer.cam #camBtn{display:none}
@media(max-width:820px){.timer.cam .t-body{grid-template-columns:1fr}.overlay{align-items:flex-start;overflow:auto}}
</style>

</head>
<body>
<div class="wrap">
  <a class="back" href="/ar#/workout">‹ رجوع للمتجر</a>
  <header>
    <div>
      <div class="eyebrow">KO SPORT · تمرين تفاعلي</div>
      <h1>التمرين <span>التفاعلي</span></h1><small style="color:var(--muted);font-size:.85rem">ملاكمة ولياقة، مع مؤقت وكاميرا بتعدّ حركاتك</small>
    </div>
    <div class="stats">
      <div class="stat"><b id="sCount">0</b><small>تمرين</small></div>
      <div class="stat"><b id="sDone">0</b><small>مكتمل</small></div>
      <div class="stat"><b id="sMin">0</b><small>دقيقة</small></div>
    </div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div>

<!-- Timer -->
<div class="overlay" id="overlay">
  <div class="timer" id="timer">
    <button class="close" id="closeBtn" aria-label="إغلاق">✕</button>
    <div class="t-body">
    <div class="cam-panel">
      <div class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="cv"></canvas>
        <div class="loading" id="camLoading">⏳ عم نجهّز الكاميرا ونموذج تتبّع الجسم...</div>
        <span class="live">● LIVE</span>
        <div class="fb" id="fb">وقّف قدّام الكاميرا لحتى يبيّن جسمك كامل</div>
      </div>
      <div class="cstats">
        <div class="g"><b id="cGood">0</b><small id="cUnit">صح</small></div>
        <div class="r"><b id="cBad">0</b><small>غلط</small></div>
        <div><b id="cAcc">—</b><small>الدقة</small></div>
      </div>
      <div class="cam-row">
        <button id="voiceBtn">🔇 الصوت</button>
        <button id="camOff">✕ سكّر الكاميرا</button>
      </div>
      <label class="cam-btn alt" for="recIn">🎥 أو صوّر فيديو / اختار فيديو وحلّلو</label>
    </div>
    <div class="t-main">
    <div class="phase" id="phase">استعد</div>
    <div class="t-name" id="tName"></div>
    <div class="t-set" id="tSet"></div>
    <div class="t-fig" id="tFig"></div>
    <div class="ring">
      <svg width="240" height="240"><circle class="bgc" cx="120" cy="120" r="108"/><circle class="fg" id="fg" cx="120" cy="120" r="108"/></svg>
      <div class="center"><div class="time" id="time">00</div><div class="sub" id="sub"></div></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="controls">
      <button id="resetBtn">↺ إعادة</button>
      <button class="primary" id="playBtn">▶ ابدأ</button>
      <button class="repdone" id="repBtn">✓ خلصت الجولة</button>
      <button id="skipBtn">⏭ تخطي</button>
    </div>
    <button class="cam-btn" id="camBtn">📷 تمرّن بالكاميرا (عدّ وتصحيح تلقائي)</button>
    </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="recIn" accept="video/*" capture="user" style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0">

<script>
/* ============================================================
   1) البيانات — عدّل أو ضيف تمارين هون بسهولة
   type: "time" = تمرين بالوقت (work بالثواني)
         "reps" = تمرين بالتكرارات (reps عدد العدّات)
   ============================================================ */
const CATEGORIES = {
  boxing : { label:"ملاكمة", color:"#b71c1c" },
  cardio : { label:"كارديو", color:"#c9a45c" },
  strength:{ label:"قوة",   color:"#1c1b22" },
  core   : { label:"بطن وجذع", color:"#3d5a40" }
};

const WORKOUTS = [
  { id:"jab-cross",  cat:"boxing",  icon:"🥊", name:"جاب - كروس", type:"time", work:60, rest:30, sets:3, level:2,
    desc:"لكمات مستقيمة سريعة مع رجوع اليد للحماية.", tip:"خلي الكوع لتحت والذقن مخبّاية ورا الكتف." },
  { id:"combo-1-2-3",cat:"boxing",  icon:"⚡", name:"كومبو 1-2-3", type:"time", work:90, rest:30, sets:3, level:3,
    desc:"جاب، كروس، هوك يسار بتسلسل متواصل.", tip:"لفّ الحوض مع الهوك، القوة من الأرض مو من الإيد." },
  { id:"slip-roll",  cat:"boxing",  icon:"🌀", name:"تفادي وانحناء", type:"time", work:45, rest:20, sets:4, level:2,
    desc:"Slip و Roll تحت حبل وهمي لتحسين الدفاع.", tip:"انزل بالركب مو بالضهر، وعيونك قدّام." },
  { id:"shadow",     cat:"boxing",  icon:"👤", name:"ملاكمة الظل", type:"time", work:180, rest:60, sets:3, level:3,
    desc:"جولة كاملة حركة ولكمات ودفاع بدون كيس.", tip:"تخيّل خصم قدامك وغيّر الزوايا باستمرار." },
  { id:"rope",       cat:"cardio",  icon:"🪢", name:"نط الحبل", type:"time", work:60, rest:30, sets:4, level:2,
    desc:"أساسي لسرعة الرجلين والتحمّل.", tip:"نط على أطراف أصابعك ونطّات صغيرة." },
  { id:"burpees",    cat:"cardio",  icon:"🔥", name:"بيربي", type:"reps", reps:12, rest:45, sets:3, level:3,
    desc:"تمرين كامل للجسم يرفع النبض بسرعة.", tip:"حافظ على ضهر مستقيم بالنزلة." },
  { id:"hi-knees",   cat:"cardio",  icon:"🏃", name:"رفع الركب", type:"time", work:40, rest:20, sets:3, level:1,
    desc:"ركض بالمكان مع رفع الركب لمستوى الخصر.", tip:"حرّك إيديك مع الرجلين متل الملاكم." },
  { id:"pushups",    cat:"strength",icon:"💪", name:"ضغط", type:"reps", reps:15, rest:45, sets:3, level:2,
    desc:"قوة الصدر والكتف والترايسبس للكمات أقوى.", tip:"الجسم خط واحد من الراس للكعب." },
  { id:"squats",     cat:"strength",icon:"🦵", name:"سكوات", type:"reps", reps:20, rest:40, sets:3, level:1,
    desc:"قاعدة قوية للرجلين = لكمة أقوى.", tip:"الركبة باتجاه أصابع الرجل." },
  { id:"plank",      cat:"core",    icon:"🧱", name:"بلانك", type:"time", work:45, rest:20, sets:3, level:2,
    desc:"ثبات الجذع لامتصاص الضربات.", tip:"شدّ البطن والمؤخرة، لا ترفع الحوض." },
  { id:"twists",     cat:"core",    icon:"🔄", name:"روسيان تويست", type:"reps", reps:20, rest:30, sets:3, level:2,
    desc:"عضلات البطن الجانبية لدوران أقوى.", tip:"لف الكتفين مو بس الإيدين." }
];

/* ============================================================
   1.5) حركات اللاعب (Poses) — كل تمرين عبارة عن وضعيات بيتنقل بينها
   الزوايا بالدرجات: 0 = لتحت، 90 = لقدّام، 180 = لفوق، -90 = لورا
   t = ميلان الجذع | ua/fa = الزند/الساعد | th/sh = الفخذ/الساق
   1 = الطرف البعيد، 2 = الطرف القريب
   ============================================================ */
const GUARD = {t:10,ua1:35,fa1:165,ua2:18,fa2:172,th1:20,sh1:6,th2:-22,sh2:-30,hd:-4};
const JAB   = {...GUARD,t:16,ua1:92,fa1:92};
const CROSS = {...GUARD,t:24,ua2:94,fa2:94,ua1:30,fa1:170,th2:-26,sh2:-40};
const HOOK  = {...GUARD,t:18,ua1:80,fa1:132};
const STAND = {t:3,ua1:10,fa1:16,ua2:-6,fa2:6,th1:3,sh1:0,th2:-3,sh2:-2};
const PUSH_UP   = {t:66,ua1:0,fa1:0,ua2:0,fa2:0,th1:-66,sh1:-66,th2:-66,sh2:-66,hd:-60,ikw:1,ik:4,bend:1};
const PUSH_DOWN = {...PUSH_UP,t:77.5,th1:-77.5,sh1:-77.5,th2:-77.5,sh2:-77.5,hd:-72};
const SQUAT_LOW = {t:60,th1:100,sh1:-30,th2:96,sh2:-34,ikw:1,ik:16,bend:-1,hd:-40,ua1:0,fa1:0,ua2:0,fa2:0};

const ANIM = {
  "jab-cross":  { dur:650,  poses:[GUARD,JAB,GUARD,CROSS] },
  "combo-1-2-3":{ dur:480,  poses:[GUARD,JAB,CROSS,HOOK,GUARD] },
  "slip-roll":  { dur:700,  poses:[GUARD,{...GUARD,t:34,hd:-14,th1:60,sh1:-18,th2:6,sh2:-55,ua1:40,fa1:150},GUARD,{...GUARD,t:24,hd:-8}] },
  "shadow":     { dur:520,  poses:[GUARD,JAB,{...GUARD,hx:108},CROSS,{...GUARD,hx:94},HOOK] },
  "rope":       { dur:300,  poses:[{...STAND,ua1:22,fa1:75,ua2:22,fa2:75,sh1:-8,sh2:-8,j:9,rope:1},{...STAND,ua1:22,fa1:70,ua2:22,fa2:70,sh1:-4,sh2:-4,j:0,rope:0}] },
  "burpees":    { dur:600,  poses:[STAND,SQUAT_LOW,PUSH_UP,PUSH_DOWN,PUSH_UP,SQUAT_LOW,{...STAND,ua1:172,fa1:176,ua2:168,fa2:174,j:22,sh1:-10,sh2:-10}] },
  "hi-knees":   { dur:260,  poses:[{...STAND,th1:90,sh1:-4,th2:-4,sh2:-6,ua1:-35,fa1:40,ua2:40,fa2:125,j:3},{...STAND,th2:90,sh2:-4,th1:-4,sh1:-6,ua2:-35,fa2:40,ua1:40,fa1:125,j:3}] },
  "pushups":    { dur:800,  poses:[PUSH_UP,PUSH_DOWN] },
  "squats":     { dur:900,  poses:[{...STAND,ua1:85,fa1:88,ua2:85,fa2:88},{t:38,th1:82,sh1:-20,th2:78,sh2:-24,ua1:88,fa1:90,ua2:86,fa2:90,hd:-20}] },
  "plank":      { dur:1400, poses:[{t:77,th1:-77,sh1:-77,th2:-77,sh2:-77,hd:-70,ikw:1,ik:27,bend:1},{t:76,th1:-76,sh1:-76,th2:-76,sh2:-76,hd:-70,ikw:1,ik:27,bend:1}] },
  "twists":     { dur:550,  poses:[{hy:180,t:-32,hd:20,th1:112,sh1:62,th2:116,sh2:66,ua1:70,fa1:115,ua2:62,fa2:118},
                                    {hy:180,t:-26,hd:30,th1:112,sh1:62,th2:116,sh2:66,ua1:25,fa1:35,ua2:20,fa2:30}] }
};

/* ============================================================
   محرك الرسم — لاعب بعضلات منحوتة (SVG)
   ============================================================ */
const G = 186; // خط الأرض
const BASE = {hx:100,t:4,hd:0,ua1:8,fa1:12,ua2:-6,fa2:4,th1:4,sh1:2,th2:-4,sh2:-4,j:0,ikw:0,ik:0,bend:1,rope:0};
const LEN = {ua:30,fa:28,th:42,sn:42};
const rad = a => a*Math.PI/180;
const D = a => [Math.sin(rad(a)), Math.cos(rad(a))];
const at = (o,v,l) => ({x:o.x+v[0]*l, y:o.y+v[1]*l});
const lerp = (a,b,u) => a+(b-a)*u;
const f1 = n => n.toFixed(1);

function ik(P,T,a,b,bend){
  const dx=T.x-P.x, dy=T.y-P.y, d=Math.min(Math.hypot(dx,dy), a+b-.01);
  const A = Math.atan2(dy,dx) + bend*Math.acos(Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d))));
  const e = {x:P.x+Math.cos(A)*a, y:P.y+Math.sin(A)*a};
  const k = Math.hypot(T.x-e.x,T.y-e.y)||1;
  return [e, {x:e.x+(T.x-e.x)/k*b, y:e.y+(T.y-e.y)/k*b}];
}

function solve(p){
  const hip = {x:p.hx, y:0};
  const T = [Math.sin(rad(p.t)), -Math.cos(rad(p.t))];
  const sh = at(hip,T,54), neck = at(hip,T,61);
  const Th = [Math.sin(rad(p.t+p.hd)), -Math.cos(rad(p.t+p.hd))];
  const head = at(neck,Th,12);
  const k1=at(hip,D(p.th1),LEN.th), a1=at(k1,D(p.sh1),LEN.sn);
  const k2=at(hip,D(p.th2),LEN.th), a2=at(k2,D(p.sh2),LEN.sn);
  let e1=at(sh,D(p.ua1),LEN.ua), h1=at(e1,D(p.fa1),LEN.fa);
  let e2=at(sh,D(p.ua2),LEN.ua), h2=at(e2,D(p.fa2),LEN.fa);
  const dy = p.hy!=null ? p.hy : G-4-Math.max(a1.y,a2.y)-p.j;
  const pts = {hip,sh,neck,head,k1,a1,k2,a2,e1,h1,e2,h2};
  for(const k in pts) pts[k].y += dy;
  if(p.ikw>0){
    const tgt = {x:pts.sh.x+p.ik, y:G-4};
    [["e1","h1"],["e2","h2"]].forEach(([e,h],i)=>{
      const [ie,ih] = ik(pts.sh,{x:tgt.x+(i?2:-2),y:tgt.y},LEN.ua,LEN.fa,p.bend);
      pts[e]={x:lerp(pts[e].x,ie.x,p.ikw),y:lerp(pts[e].y,ie.y,p.ikw)};
      pts[h]={x:lerp(pts[h].x,ih.x,p.ikw),y:lerp(pts[h].y,ih.y,p.ikw)};
    });
  }
  return pts;
}

// طرف عضلي: عرض متغيّر + انتفاخ العضلة + خط تفصيل + لمعة
function limb(A,B,w1,w2,bulge,bp,fill,detail=true){
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
  const l=[], r=[], c=[], s=[];
  for(let i=0;i<=12;i++){
    const u=i/12, w=lerp(w1,w2,u)+bulge*Math.exp(-(((u-bp)/.27)**2));
    const x=A.x+dx*u, y=A.y+dy*u;
    l.push(`${f1(x+nx*w)},${f1(y+ny*w)}`); r.push(`${f1(x-nx*w)},${f1(y-ny*w)}`);
    if(u>.12&&u<.8) c.push(`${f1(x+nx*w*.25)},${f1(y+ny*w*.25)}`);
    if(u>.08&&u<.85) s.push(`${f1(x+nx*w*.62)},${f1(y+ny*w*.62)}`);
  }
  return `<path d="M${l.join("L")}L${r.reverse().join("L")}Z" fill="${fill}" stroke="#1d0f05" stroke-width="1" stroke-linejoin="round"/>`+
    (detail?`<path d="M${c.join("L")}" stroke="#3a1d08" stroke-opacity=".45" stroke-width="1" fill="none"/>`:"")+
    `<path d="M${s.join("L")}" stroke="#ffe2b8" stroke-opacity=".45" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
}
const joint = (P,r,fill) => `<circle cx="${f1(P.x)}" cy="${f1(P.y)}" r="${r}" fill="${fill}"/>`;

const TORSO = "M9,3 C11,-6 11,-18 12,-27 C13,-34 18,-40 17,-47 C16,-53 10,-58 4,-60 C-1,-62 -8,-60 -12,-55 C-15,-50 -13,-42 -11,-34 C-10,-27 -10,-20 -12,-13 C-15,-8 -15,-1 -12,3 Z";
const TORSO_D = "M5,-49 Q15,-41 10,-37 M7,-33 L6,-6 M6,-29 L11,-29 M6,-22 L11,-22 M6,-15 L10,-15 M-10,-45 Q-5,-34 -8,-22 M1,-27 Q4,-13 8,-1 M-12,-9 Q-7,-4 -13,1";

function figureSVG(p, accent, gloves){
  const P = solve(p), sk="url(#skin)", skD="url(#skinD)";
  const foot = (a,sh,f) => { const v=D(sh), q={x:a.x+v[1]*11,y:a.y-v[0]*11}; return limb(a,q,4,2.6,0,.5,f,false); };
  const leg = (k,a,th,sh,f) => limb(P.hip,k,8,5,2.6,.38,f)+joint(k,5,f)+limb(k,a,5,3,2.3,.28,f)+foot(a,sh,f);
  const shorts = k => limb(P.hip,{x:lerp(P.hip.x,k.x,.48),y:lerp(P.hip.y,k.y,.48)},10,8.4,0,.5,accent,false);
  const hand = (h,f) => gloves
      ? `<circle cx="${f1(h.x)}" cy="${f1(h.y)}" r="6.6" fill="${accent}" stroke="#1d0f05"/><circle cx="${f1(h.x-1.8)}" cy="${f1(h.y-2)}" r="2" fill="#fff" opacity=".35"/>`
      : joint(h,3.8,f);
  const arm = (e,h,f) => joint(P.sh,7,f)+limb(P.sh,e,5.6,3.6,2.3,.42,f)+joint(e,3.6,f)+limb(e,h,4.3,2.6,1.5,.3,f)+hand(h,f);
  const ang = p.t, hang = p.t+p.hd;
  let rope = "";
  if(p.rope!=null && ANIM_ROPE){
    const cy = lerp(P.head.y-24, G+1, p.rope);
    rope = `<path d="M${f1(P.h1.x)},${f1(P.h1.y)} C${f1(P.h1.x-48)},${f1(cy)} ${f1(P.h2.x+48)},${f1(cy)} ${f1(P.h2.x)},${f1(P.h2.y)}" stroke="#e8e8e8" stroke-width="1.6" fill="none" opacity=".8"/>`;
  }
  return `
  <ellipse cx="${f1(P.hip.x)}" cy="${G+2}" rx="${46-p.j}" ry="4" fill="#000" opacity=".45"/>
  ${rope}
  ${leg(P.k1,P.a1,p.th1,p.sh1,skD)}${shorts(P.k1)}
  ${arm(P.e1,P.h1,skD)}
  <g transform="translate(${f1(P.hip.x)},${f1(P.hip.y)}) rotate(${f1(ang)})">
    <path d="${TORSO}" fill="url(#skin)" stroke="#1d0f05" stroke-width="1"/>
    <path d="${TORSO_D}" stroke="#3a1d08" stroke-opacity=".55" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M14,-46 C15,-40 12,-36 11,-28" stroke="#ffe2b8" stroke-opacity=".5" stroke-width="1.4" fill="none"/>
    <path d="M11,-9 L10,4 L-13.5,4 L-13.5,-9 Z" fill="${accent}" stroke="#1d0f05"/>
    <rect x="-13.5" y="-10" width="25" height="3" fill="#111" opacity=".6"/>
  </g>
  ${limb(P.neck,P.head,5,4.6,0,.5,sk,false)}
  <g transform="translate(${f1(P.head.x)},${f1(P.head.y)}) rotate(${f1(hang)})">
    <ellipse cx="0" cy="-2" rx="9" ry="10" fill="url(#skin)" stroke="#1d0f05"/>
    <path d="M2,4 Q9,9 9,1 L10,-2 L8.5,-4" fill="url(#skin)" stroke="#1d0f05" stroke-linejoin="round"/>
    <path d="M-9,-3 Q-8,-13 1,-12.5 Q7,-12 8,-7 Q0,-9 -9,-3Z" fill="#1a0d05"/>
    <circle cx="-2" cy="0" r="1.8" fill="#5c3313"/>
  </g>
  ${leg(P.k2,P.a2,p.th2,p.sh2,sk)}${shorts(P.k2)}
  ${arm(P.e2,P.h2,sk)}`;
}
let ANIM_ROPE = false;

const DEFS = `<defs>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0bf84"/><stop offset=".5" stop-color="#c9864a"/><stop offset="1" stop-color="#7a431b"/></linearGradient>
  <linearGradient id="skinD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b37640"/><stop offset="1" stop-color="#5a3011"/></linearGradient>
</defs>`;

class Athlete{
  constructor(host, w, scale=1){
    this.w=w; this.anim=ANIM[w.id]; this.accent=CATEGORIES[w.cat].color;
    this.gloves = w.cat==="boxing"; this.rope = w.id==="rope";
    host.insertAdjacentHTML("beforeend",
      `<svg viewBox="5 4 190 192" preserveAspectRatio="xMidYMax meet">${DEFS.replace(/id="(skin\w*)"/g,`id="$1-${uid}"`)}
       <line x1="0" y1="${G+4}" x2="200" y2="${G+4}" style="stroke:var(--line)" stroke-width="1"/><g></g></svg>`);
    this.svg = host.lastElementChild; this.g = this.svg.querySelector("g:last-child"); this.id=uid++;
    this.playing = true; this.offset = Math.random()*2000;
  }
  pose(ms){
    const {poses,dur} = this.anim, n=poses.length;
    if(!this.playing) ms = 0;
    const tt=(ms+this.offset)/dur, i=Math.floor(tt)%n, u=tt%1;
    const e = u<.18 ? 0 : u>.88 ? 1 : (1-Math.cos(Math.PI*(u-.18)/.7))/2;
    const A={...BASE,...poses[i]}, B={...BASE,...poses[(i+1)%n]}, p={};
    for(const k in A) p[k] = (A[k]==null||B[k]==null) ? (A[k]??B[k]) : lerp(A[k],B[k],e);
    if(!this.playing){ p.t += Math.sin(ms/600)*1.2; }
    return p;
  }
  draw(ms){
    ANIM_ROPE = this.rope;
    this.g.innerHTML = figureSVG(this.pose(ms),this.accent,this.gloves)
      .replace(/url\(#(skin\w*)\)/g,`url(#$1-${this.id})`);
  }
}
let uid = 0, athletes = [], modalAthlete = null;
let last = 0;
function loop(ms){
  if(ms-last > 33){ last = ms;
    athletes.forEach(a => a.draw(ms));
    if(modalAthlete && $("#overlay").classList.contains("show")){
      modalAthlete.playing = T.running && T.phase==="work";
      modalAthlete.draw(ms);
    }
  }
  requestAnimationFrame(loop);
}

/* ============================================================

/* ============================================================
   3) الصوت والتنبيهات
   ============================================================ */
let audioCtx;
function beep(freq=880, dur=.15, times=1){
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<times;i++){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + i*(dur+.08);
    o.type="square"; o.frequency.value=freq;
    g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+dur);
  }
}
const SOUND = {
  tick : () => beep(660,.08),
  start: () => beep(1046,.35),
  rest : () => beep(520,.25,2),
  end  : () => beep(1318,.2,3)
};
function vibrate(p){ navigator.vibrate && navigator.vibrate(p); }
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ============================================================
   4) محرك المؤقت (Ready → Work → Rest → ... → Finish)
   ============================================================ */
const R = 2*Math.PI*108, fg = $("#fg");
fg.style.strokeDasharray = R;

const T = { w:null, phase:"ready", set:1, left:0, total:0, running:false, int:null };
const PHASE_UI = {
  ready :{ label:"استعد",  color:"#c9a45c" },
  work  :{ label:"🔥 تمرّن", color:"#c62828" },
  rest  :{ label:"😮‍💨 راحة", color:"#2f6fb3" },
  finish:{ label:"🏆 أحسنت!", color:"#1f8f4e" }
};

function openTimer(w){
  T.w = w; resetTimer(); Coach.reset();
  $("#tName").textContent = w.icon+" "+w.name;
  $("#tip").textContent = "💡 "+w.tip;
  $("#tFig").innerHTML = ""; modalAthlete = new Athlete($("#tFig"), w); modalAthlete.offset = 0;
  $("#overlay").classList.add("show");
}
function closeTimer(){ stop(); stopCamera(); $("#overlay").classList.remove("show"); }

function setPhase(p, secs){
  T.phase = p; T.left = T.total = secs;
  const ui = PHASE_UI[p], box = $("#timer");
  box.className = "timer "+p;
  $("#phase").textContent = ui.label; $("#phase").style.color = ui.color;
  fg.style.stroke = ui.color;
  $("#tSet").textContent = p==="finish" ? `خلصت ${T.w.sets} جولات` : `الجولة ${T.set} من ${T.w.sets}`;

  const isReps = p==="work" && T.w.type==="reps";
  $("#repBtn").style.display = isReps ? "block" : "none";
  $("#playBtn").style.display = isReps || p==="finish" ? "none" : "block";
  $("#sub").textContent = isReps ? "اضغط لما تخلص" : (p==="work"?"ثانية":p==="rest"?"ثانية راحة":p==="ready"?"تحضير":"");
  box.classList.add("flash"); setTimeout(()=>box.classList.remove("flash"),500);
  draw();
}

function draw(){
  const isReps = T.phase==="work" && T.w.type==="reps";
  $("#time").textContent = T.phase==="finish" ? "✓" : isReps ? T.w.reps+"×" : String(T.left).padStart(2,"0");
  const ratio = isReps||T.phase==="finish" ? 1 : T.left/T.total;
  fg.style.strokeDashoffset = R*(1-ratio);
}

function tick(){
  if(T.phase==="work" && T.w.type==="reps") return;
  T.left--;
  if(T.left>0 && T.left<=3) SOUND.tick();
  if(T.left<=0) return next();
  draw();
}

function next(){
  if(T.phase==="ready"){ startWork(); }
  else if(T.phase==="work"){
    if(T.set>=T.w.sets) return finish();
    SOUND.rest(); vibrate([150,80,150]); toast("وقت الراحة — خد نفس 😮‍💨");
    setPhase("rest", T.w.rest);
  }
  else if(T.phase==="rest"){ T.set++; startWork(); }
}
function startWork(){
  SOUND.start(); vibrate(300); toast(`يلا! الجولة ${T.set} 🔥`);
  Coach.setCount = 0;
  setPhase("work", T.w.type==="time" ? T.w.work : 1);
}
function finish(){
  stop(); SOUND.end(); vibrate([200,100,200,100,400]);
  setPhase("finish",1);
  const tot = Coach.good+Coach.bad;
  toast(Coach.on && tot ? `🏆 خلصت! الدقة ${Math.round(Coach.good/tot*100)}%` : "🏆 خلصت التمرين، عاش!");
  done.add(T.w.id); renderGrid();
}

function play(){
  if(T.running){ stop(); return; }
  T.running = true; $("#playBtn").textContent = "⏸ إيقاف";
  if(T.phase==="ready" && T.left===T.total) SOUND.tick();
  T.int = setInterval(tick,1000);
}
function stop(){ T.running=false; clearInterval(T.int); $("#playBtn").textContent="▶ متابعة"; }
function resetTimer(){
  stop(); T.set=1; setPhase("ready",5); $("#playBtn").textContent="▶ ابدأ";
}

$("#playBtn").onclick = play;
$("#resetBtn").onclick = resetTimer;
$("#skipBtn").onclick = () => { if(T.phase!=="finish") next(); };
$("#repBtn").onclick = () => next();
$("#closeBtn").onclick = closeTimer;
$("#overlay").onclick = e => { if(e.target.id==="overlay") closeTimer(); };
document.addEventListener("keydown", e => {
  if(!$("#overlay").classList.contains("show")) return;
  if(e.code==="Space"){ e.preventDefault(); $("#repBtn").style.display==="block" ? next() : play(); }
  if(e.key==="Escape") closeTimer();
});

/* ============================================================
   5) المدرّب بالكاميرا — تتبّع الجسم (MediaPipe Pose)
   بيحلل الحركة، بيحكم صح/غلط، وبيعدّ الضربات والتكرارات
   ============================================================ */
const MP_VER = "0.10.14";
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL  = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const LM = {nose:0,ls:11,rs:12,le:13,re:14,lw:15,rw:16,lh:23,rh:24,lk:25,rk:26,la:27,ra:28};
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];

let landmarker = null, stream = null, camRAF = 0, lastVT = -1;

// ---- أدوات هندسية ----
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const mid  = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2, v:Math.min(a.v,b.v)});
function ang(a,b,c){ // الزاوية عند b
  let d = Math.atan2(c.y-b.y,c.x-b.x) - Math.atan2(a.y-b.y,a.x-b.x);
  d = Math.abs(d*180/Math.PI); return d>180 ? 360-d : d;
}
const vertAng = (top,bot) => Math.abs(Math.atan2(top.x-bot.x, bot.y-top.y)*180/Math.PI); // 0 = واقف، 90 = أفقي
function side(k){ // الجنب الأوضح للكاميرا
  const sc = s => ["s","e","w","h","k","a"].reduce((t,j)=>t+k[s+j].v,0);
  const s = sc("l")>=sc("r") ? "l" : "r";
  return {s:k[s+"s"],e:k[s+"e"],w:k[s+"w"],h:k[s+"h"],k:k[s+"k"],a:k[s+"a"]};
}

// ---- حالة المدرّب ----
const Coach = {
  on:false, good:0, bad:0, setCount:0, st:{}, msg:"", kind:"", t:0, voice:false, lastSay:"",
  reset(){ this.good=this.bad=this.setCount=0; this.st={}; this.ui(); },
  mode:"live",
  counting(){ return this.mode==="file" || (T.running && T.phase==="work"); },
  ok(m, quiet){ if(!this.counting()) return; this.good++; this.setCount++; this.show(m,"good"); if(!quiet) beep(1200,.07); this.check(); },
  no(m){ if(!this.counting()) return; this.bad++; this.show(m,"bad"); beep(180,.22); vibrate(120); this.speak(m); },
  tip(m){ if(performance.now()-this.t > 1600 || this.kind!=="warn") this.show(m,"warn"); },
  show(m,k){ this.msg=m; this.kind=k; this.t=performance.now(); this.ui(); },
  speak(m){
    if(!this.voice || !window.speechSynthesis || m===this.lastSay && performance.now()-this.t<3000) return;
    this.lastSay = m; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(m.replace(/[^؀-ۿ\s]/g,"")); u.lang="ar-SA"; u.rate=1.1; speechSynthesis.speak(u);
  },
  check(){ if(this.mode==="live" && T.w.type==="reps" && this.setCount >= T.w.reps){ this.setCount=0; setTimeout(next,350); } },
  ui(){
    $("#cGood").textContent = this.good; $("#cBad").textContent = this.bad;
    const tot = this.good+this.bad; $("#cAcc").textContent = tot ? Math.round(this.good/tot*100)+"%" : "—";
    if(this.msg){ const f=$("#fb"); f.textContent=this.msg; f.className="fb "+this.kind; }
  }
};

// ---- المحللات: لكل نوع تمرين منطق خاص ----
const ANALYZERS = {
  // ملاكمة: كشف الجاب/الكروس (امتداد الإيد) والهوك (كوع مرفوع ومثني)
  boxing(k,st,now){
    const sw = dist(k.ls,k.rs) || .1;
    for(const s of ["l","r"]){
      const sh=k[s+"s"], el=k[s+"e"], wr=k[s+"w"], o = s==="l"?"r":"l";
      if(Math.min(sh.v,el.v,wr.v) < .5) continue;
      const a = ang(sh,el,wr), reach = dist(sh,wr)/sw;
      const S = st[s] || (st[s] = {m:"guard"});
      if(S.m==="guard"){
        if(a>145 && reach>1.25){ S.m="out"; S.kind="straight"; S.peak=wr.y; S.ext=a; }
        else if(el.y < sh.y+.25*sw && a>55 && a<130 && reach>.9){ S.m="out"; S.kind="hook"; S.peak=wr.y; }
      } else {
        S.ext = Math.max(S.ext||0, a);
        const back = reach<.85 || (S.kind==="straight" ? a<105 : el.y > sh.y+.45*sw);
        if(back){
          S.m = "guard";
          const guardOk  = k[o+"w"].y < k[o+"s"].y + .2*sw;
          const heightOk = S.peak < sh.y + .7*sw && S.peak > k.nose.y - .8*sw;
          if(!guardOk)        Coach.no("ارفع الإيد التانية للحماية");
          else if(!heightOk)  Coach.no("وجّه الضربة لمستوى الوجه");
          else if(S.kind==="straight" && S.ext<160) Coach.no("مدّ إيدك للآخر");
          else Coach.ok(S.kind==="hook" ? "هوك ممتاز 💥" : "ضربة نظيفة 💥");
        }
      }
    }
    const low = k.lw.y > k.ls.y+.45*sw && k.rw.y > k.rs.y+.45*sw;
    if(low){ st.low = st.low||now; if(now-st.low > 1500) Coach.tip("ارفع إيديك للحماية! 🛡"); } else st.low = 0;
  },

  // تفادي: الراس بينزل تحت مستوى البداية — لازم الانحناء يكون من الركب
  slip(k,st){
    const tl = dist(mid(k.ls,k.rs), mid(k.lh,k.rh)) || .2;
    const kneeA = Math.min(ang(k.lh,k.lk,k.la), ang(k.rh,k.rk,k.ra));
    if(!st.m){ st.m="up"; st.base=k.nose.y; }
    const drop = (k.nose.y - st.base)/tl;
    if(st.m==="up"){ st.base = st.base*.97 + k.nose.y*.03; if(drop>.22){ st.m="down"; st.kmin=kneeA; } }
    else { st.kmin = Math.min(st.kmin,kneeA);
      if(drop<.08){ st.m="up"; st.kmin<155 ? Coach.ok("تفادي ممتاز 🌀") : Coach.no("انزل بالركب مو بالضهر"); } }
  },

  squat(k,st){
    const L = side(k), a = ang(L.h,L.k,L.a), lean = vertAng(L.s,L.h);
    if(!st.m) st.m="up";
    if(st.m==="up" && a<130){ st.m="down"; st.min=a; st.lean=lean; }
    else if(st.m==="down"){
      st.min=Math.min(st.min,a); st.lean=Math.max(st.lean,lean);
      if(a>160){ st.m="up";
        if(st.min>105)      Coach.no("انزل أكتر، الفخذ لمستوى الأرض");
        else if(st.lean>55) Coach.no("ضهرك مايل كتير، ارفع صدرك");
        else Coach.ok("سكوات صح ✓"); }
    }
  },

  pushup(k,st){
    const L = side(k);
    if(vertAng(L.s,L.h) < 50){ Coach.tip("انزل لوضعية الضغط، وخلّي جنبك للكاميرا"); return; }
    const e = ang(L.s,L.e,L.w), body = ang(L.s,L.h,L.a);
    const yl = L.s.y + (L.a.y-L.s.y)*(L.h.x-L.s.x)/((L.a.x-L.s.x)||1e-3);
    if(!st.m) st.m="up";
    if(st.m==="up" && e<130){ st.m="down"; st.min=e; st.body=body; st.sag=L.h.y>yl; }
    else if(st.m==="down"){
      st.min=Math.min(st.min,e); if(body<st.body){ st.body=body; st.sag=L.h.y>yl; }
      if(e>155){ st.m="up";
        if(st.min>100)       Coach.no("انزل أكتر بصدرك");
        else if(st.body<155) Coach.no(st.sag ? "الحوض نازل، شدّ بطنك" : "الحوض عالي، خلّي جسمك خط مستقيم");
        else Coach.ok("ضغطة ممتازة 💪"); }
    }
  },

  // بلانك: كل ثانية بوضعية صح = نقطة
  plank(k,st,now){
    const L = side(k), body = ang(L.s,L.h,L.a);
    if(vertAng(L.s,L.h) < 55){ Coach.tip("انزل لوضعية البلانك، وخلّي جنبك للكاميرا"); return; }
    const yl = L.s.y + (L.a.y-L.s.y)*(L.h.x-L.s.x)/((L.a.x-L.s.x)||1e-3);
    if(!st.t) st.t = now;
    if(now-st.t >= 1000){ st.t = now;
      if(body >= 160) Coach.ok("ثابت ومستقيم ✓", true);
      else Coach.no(L.h.y>yl ? "الحوض نازل، شدّ بطنك" : "نزّل الحوض شوي");
    }
  },

  hiknees(k,st){
    for(const s of ["l","r"]){
      const h=k[s+"h"], kn=k[s+"k"]; if(Math.min(h.v,kn.v)<.5) continue;
      const S = st[s] || (st[s] = {m:"down", len:dist(h,kn)});
      if(S.m==="down") S.len = Math.max(S.len*.995, dist(h,kn));
      const rise = (h.y + S.len - kn.y)/S.len; // 0 واقف، 1 الركبة بمستوى الخصر
      if(S.m==="down" && rise>.45){ S.m="up"; S.peak=rise; }
      else if(S.m==="up"){ S.peak=Math.max(S.peak,rise);
        if(rise<.2){ S.m="down"; S.peak>.8 ? Coach.ok("ركبة عالية 🔥",true) : Coach.no("ارفع الركبة لمستوى الخصر"); } }
    }
  },

  rope(k,st){
    const hy = (k.lh.y+k.rh.y)/2, tl = dist(mid(k.ls,k.rs), mid(k.lh,k.rh)) || .2;
    if(st.base==null){ st.base=hy; st.m="ground"; }
    if(st.m==="ground"){ st.base = st.base*.93 + hy*.07; if(st.base-hy > .06*tl){ st.m="air"; st.hands = false; } }
    else { if(k.lw.y<k.ls.y || k.rw.y<k.rs.y) st.hands = true;
      if(st.base-hy < .02*tl){ st.m="ground"; st.hands ? Coach.no("خلّي إيديك جنب خصرك") : Coach.ok("نطّة ✓",true); } }
  },

  burpee(k,st,now){
    const L = side(k), lean = vertAng(L.s,L.h);
    st.m = st.m || "stand";
    if(st.m==="stand" && lean>60) st.m="floor";
    else if(st.m==="floor" && lean<25){ st.m="rise"; st.t=now; }
    else if(st.m==="rise"){
      if(k.lw.y<k.nose.y && k.rw.y<k.nose.y){ st.m="stand"; Coach.ok("بيربي كامل 🔥"); }
      else if(now-st.t>1600){ st.m="stand"; Coach.no("كمّل بنطّة والإيدين لفوق"); }
    }
  },

  twist(k,st){
    const sw = dist(k.ls,k.rs)||.1, c = mid(k.lh,k.rh).x, off = (mid(k.lw,k.rw).x - c)/sw;
    const lean = vertAng(mid(k.ls,k.rs), mid(k.lh,k.rh));
    const sideNow = off>.45 ? "R" : off<-.45 ? "L" : null;
    if(sideNow && sideNow!==st.last){
      if(st.last){ lean<12 ? Coach.no("ميل لورا شوي") : lean>65 ? Coach.no("لا تميل كتير لورا") : Coach.ok("لفّة ممتازة 🔄",true); }
      st.last = sideNow;
    }
  }
};
const ANALYZER_OF = { "jab-cross":"boxing","combo-1-2-3":"boxing","shadow":"boxing","slip-roll":"slip",
  "rope":"rope","burpees":"burpee","hi-knees":"hiknees","pushups":"pushup","squats":"squat","plank":"plank","twists":"twist" };
const UNIT_OF = { boxing:"ضربة صح", plank:"ثانية صح", rope:"نطّة صح", twist:"لفّة صح" };

// ---- تشغيل الكاميرا والنموذج ----
async function loadModel(){
  if(landmarker) return;
  const { PoseLandmarker, FilesetResolver } = await import(`${MP_URL}/vision_bundle.mjs`);
  const files = await FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
  const opts = d => ({ baseOptions:{modelAssetPath:MODEL, delegate:d}, runningMode:"VIDEO", numPoses:1 });
  try{ landmarker = await PoseLandmarker.createFromOptions(files, opts("GPU")); }
  catch{ landmarker = await PoseLandmarker.createFromOptions(files, opts("CPU")); }
}
// تطبيق الأندرويد ما بيعطي الصفحة كاميرا لايف، فمنحوّل على المتصفح (كروم) فوراً.
// التطبيق بيفتح أي دومين غير دومينو بالمتصفح، فمنستعمل الدومين التاني، ومعو intent كروم كاحتياط.
const IN_APP = /; wv\)|appcreator/i.test(navigator.userAgent||"");
function browserUrls(){
  const path = "/workout.html?ex=" + encodeURIComponent(T.w.id) + "&cam=1";
  const other = /pages\.dev$/.test(location.hostname) ? "https://ko-sport.online" : "https://ko-sport.pages.dev";
  const main = "https://ko-sport.online" + path;
  return { other: other + path,
    intent: "intent://ko-sport.online" + path + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(main) + ";end",
    any: "intent://ko-sport.online" + path + "#Intent;scheme=https;action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent(main) + ";end" };
}
function goBrowser(){
  const u = browserUrls();
  $("#timer").classList.add("cam");
  $("#camLoading").style.display = "grid";
  $("#camLoading").innerHTML = `<div>🌐 عم نفتح الكاميرا اللايف بالمتصفح...<br><small style="color:var(--muted)">إذا ما انفتح المتصفح، اكبس واحد من هالأزرار:</small>
    <a class="cam-btn" href="${u.other}" target="_blank" rel="noopener">🌐 افتح بالمتصفح</a>
    <a class="cam-btn alt" href="${u.intent}" target="_top">افتح بكروم</a>
    <a class="cam-btn alt" href="${u.any}" target="_top">افتح بأي متصفح</a></div>`;
  try{ window.top.location.href = u.other; }catch(e){ location.href = u.other; }
}
async function startCamera(){
  if(IN_APP) return goBrowser();
  Coach.mode = "live";
  const box = $("#timer"); box.classList.add("cam");
  $("#camLoading").style.display="grid"; $("#camLoading").textContent="⏳ عم نجهّز الكاميرا ونموذج تتبّع الجسم...";
  $("#cUnit").textContent = UNIT_OF[ANALYZER_OF[T.w.id]] || "تكرار صح";
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error("no-media"),{name:"NotAllowedError"});
    stream = await Promise.race([
      navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"},audio:false}),
      new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error("timeout"),{name:"NotAllowedError"})),9000))
    ]);
    const v = $("#video"); v.removeAttribute("src"); v.srcObject = stream; v.loop=false; await v.play();
    $(".stage").classList.remove("file");
    await loadModel();
    $("#camLoading").style.display="none";
    Coach.on = true; Coach.st = {}; Coach.show("جاهز! اضغط ▶ ابدأ ليبلش العدّ","warn");
    camLoop();
  }catch(err){
    console.error(err);
    if(!stream){ // الكاميرا المباشرة ممنوعة (متل جوّا تطبيق الأندرويد): منعرض بدائل جوّا التطبيق نفسو
      const framed = window.top !== window;
      $("#camLoading").innerHTML = `<div>📱 الكاميرا المباشرة ما فتحت هون.<br>
        ${framed ? `<button class="cam-btn" id="toFull">📷 افتح صفحة الكاميرا الكاملة</button>` : ""}
        <label class="cam-btn" for="recIn">🎥 صوّر تمرينك فيديو وخلّينا نحلّلو</label>
        <small style="display:block;margin-top:10px;color:var(--muted)">بتصوّر حالك بكاميرا الموبايل، وبنعدّلك الضربات والتكرارات ومنقلّك شو الصح وشو الغلط.</small>
        <small style="display:block;margin-top:6px;color:#555a68;direction:ltr">${(err && err.name) || "?"}${navigator.mediaDevices ? "" : " · no-mediaDevices"}</small></div>`;
      if(framed) $("#toFull").onclick = openFullPage;
      return;
    }
    $("#camLoading").textContent = err.name==="NotAllowedError"
      ? "🚫 ما في إذن للكاميرا. اسمح للموقع يستخدم الكاميرا من إعدادات المتصفح."
      : stream ? "⚠️ الكاميرا اشتغلت بس ما قدرنا نحمّل نموذج تتبّع الجسم. تأكد من الإنترنت وجرّب مرة تانية."
      : "⚠️ ما قدرنا نشغّل الكاميرا. تأكد إن الموقع على https وإن الكاميرا مو مستخدمة ببرنامج تاني.";
  }
}
// صفحة الكاميرا الكاملة جوّا التطبيق نفسو (مو iframe)
function openFullPage(){
  const url = "/workout.html?ex=" + encodeURIComponent(T.w.id) + "&cam=1&full=1";
  try{ window.top.location.href = url; }catch(e){ location.href = url; }
}
// تحليل فيديو مصوّر: بيشتغل حتى لو الصفحة ممنوعة من الكاميرا المباشرة
async function analyzeFile(f){
  if(!f) return;
  stopStream();
  $("#timer").classList.add("cam");
  $("#camLoading").style.display="grid"; $("#camLoading").textContent="⏳ عم نجهّز تحليل الفيديو...";
  try{
    await loadModel();
    const v = $("#video"); v.srcObject = null; v.src = URL.createObjectURL(f); v.muted = true; v.loop = false;
    $(".stage").classList.add("file");
    Coach.reset(); Coach.mode = "file"; Coach.on = true;
    v.onended = () => {
      const tot = Coach.good + Coach.bad;
      Coach.show(tot ? `✅ خلص التحليل: ${Coach.good} صح و ${Coach.bad} غلط (الدقة ${Math.round(Coach.good/tot*100)}%)` : "ما قدرنا نعدّ شي، صوّر جسمك كامل وبضو منيح وجرّب كمان مرة", tot ? "good" : "warn");
      Coach.mode = "done"; SOUND.end();
    };
    await v.play();
    $("#camLoading").style.display="none";
    Coach.show("عم نحلّل الفيديو... 🔍","warn");
    camLoop();
  }catch(err){
    console.error(err);
    $("#camLoading").textContent = "⚠️ ما قدرنا نحلّل الفيديو. تأكد من الإنترنت وجرّب كمان مرة.";
  }
}
function stopStream(){ cancelAnimationFrame(camRAF); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } }
function stopCamera(){
  Coach.on = false; stopStream(); const v=$("#video"); v.pause(); v.removeAttribute("src");
  $("#timer").classList.remove("cam");
}

function camLoop(){
  if(!Coach.on) return;
  const v = $("#video"), cv = $("#cv"), ctx = cv.getContext("2d");
  if(v.readyState>=2 && v.currentTime!==lastVT){
    lastVT = v.currentTime;
    if(cv.width!==v.videoWidth){ cv.width=v.videoWidth; cv.height=v.videoHeight; }
    const res = landmarker.detectForVideo(v, performance.now());
    ctx.clearRect(0,0,cv.width,cv.height);
    const lm = res.landmarks && res.landmarks[0];
    if(lm){
      drawSkeleton(ctx, lm, cv.width, cv.height);
      const ar = v.videoWidth/v.videoHeight, k = {};
      for(const n in LM){ const p=lm[LM[n]]; k[n] = {x:p.x*ar, y:p.y, v:p.visibility ?? 1}; }
      const core = Math.min(k.ls.v,k.rs.v,k.lh.v,k.rh.v);
      if(core < .5) Coach.tip("ابعد شوي عن الكاميرا لحتى يبيّن جسمك كامل");
      else {
        const name = ANALYZER_OF[T.w.id];
        ANALYZERS[name](k, Coach.st[name] || (Coach.st[name]={}), performance.now());
        if(Coach.mode==="live" && !Coach.counting() && Coach.kind!=="warn") Coach.tip("اضغط ▶ ابدأ ليبلش العدّ");
      }
    } else Coach.tip("ما عم شوفك 👀 وقّف قدّام الكاميرا");
  }
  camRAF = requestAnimationFrame(camLoop);
}

function drawSkeleton(ctx, lm, W, H){
  const age = performance.now()-Coach.t;
  const col = age<700 && Coach.kind==="good" ? "#3ec47a" : age<700 && Coach.kind==="bad" ? "#ef5350" : "#c9a45c";
  ctx.lineWidth = Math.max(3, W/140); ctx.lineCap="round"; ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=12;
  for(const [a,b] of BONES){
    if((lm[a].visibility??1)<.4 || (lm[b].visibility??1)<.4) continue;
    ctx.beginPath(); ctx.moveTo(lm[a].x*W, lm[a].y*H); ctx.lineTo(lm[b].x*W, lm[b].y*H); ctx.stroke();
  }
  ctx.shadowBlur=0; ctx.fillStyle="#fff";
  for(const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){
    if((lm[i].visibility??1)<.4) continue;
    ctx.beginPath(); ctx.arc(lm[i].x*W, lm[i].y*H, W/110, 0, 7); ctx.fill();
  }
}

$("#camBtn").onclick = startCamera;
if(IN_APP) $("#camBtn").textContent = "📷 الكاميرا اللايف (بتنفتح بالمتصفح)";
$("#recIn").onchange = e => { analyzeFile(e.target.files[0]); e.target.value = ""; };
$("#camOff").onclick = stopCamera;
$("#voiceBtn").onclick = () => { Coach.voice = !Coach.voice; $("#voiceBtn").textContent = Coach.voice ? "🔊 الصوت" : "🔇 الصوت"; };

renderFilters(); renderGrid(); requestAnimationFrame(loop);
// رابط مباشر لتمرين مع الكاميرا (منستعملو لما التطبيق يفتح الكاميرا بكروم): ?ex=<id>&cam=1
if(window.top === window) document.body.classList.add("full");
(() => { const q = new URLSearchParams(location.search), w = WORKOUTS.find(x=>x.id===q.get("ex"));
  if(w){ openTimer(w); if(q.get("cam")==="1") startCamera(); } })();
</script>
