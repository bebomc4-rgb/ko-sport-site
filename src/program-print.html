<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>طباعة البرنامج | KO SPORT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3ef;color:#121212;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.tools{position:sticky;top:0;display:flex;justify-content:center;gap:10px;padding:12px;background:#fff;border-bottom:1px solid #ddd;z-index:2}
.tools button,.tools a{border:0;border-radius:10px;padding:10px 16px;background:#171717;color:#fff;text-decoration:none;font:700 16px system-ui;cursor:pointer}
.tools a{background:#eee;color:#171717}
.wrap{width:min(760px,calc(100% - 24px));margin:18px auto;padding:18px;background:#fff;border:1px solid #e4e0d8;border-radius:14px}
.ptitle{margin:2px 0 14px}.ptitle h1{margin:0;font-size:26px;font-weight:800}.ptitle small{color:#5f5c56}
.card{background:#fff;border:1px solid #d5c7a6;border-radius:12px;padding:14px;margin-bottom:12px}
.sum{background:#fbf6ea;border:1px solid #c9a45c;border-radius:12px;padding:14px;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{border:1px solid #c9a45c;border-radius:99px;padding:2px 10px;color:#8c6b31;font-size:13px;font-weight:700}
.dy .hd{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.dy .wu{color:#555;border-bottom:1px dashed #ddd;padding-bottom:8px}
.ex{padding:9px 0;border-bottom:1px solid #e4e0d8}.ex .n{font-weight:700}.ex .n em{font-style:normal;color:#8c6b31;font-size:13px}
.ex .p{display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}.ex .p b{color:#8c6b31}.ex .p span,.hint,.cd{color:#555}
.ex .t{color:#555;font-size:14px}.fin{background:#fbf6ea;border:1px solid #c9a45c;border-radius:10px;padding:9px 12px;margin-top:8px}
.nu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.nu div{background:#f7f5f0;border-radius:10px;padding:8px 4px}.nu b{display:block;color:#8c6b31}.nu small{font-size:13px}
.shop{display:flex;flex-wrap:wrap;gap:8px}.shop a{color:#8c6b31}.nt{padding-inline-start:20px}
.msg{text-align:center;padding:35px 10px}
@media print{
  body{background:#fff}
  .tools{display:none!important}
  .wrap{width:auto;margin:0;padding:0;border:0;border-radius:0}
  .card,.sum{box-shadow:none;break-inside:avoid}
}
@media(max-width:440px){.nu{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav class="tools"><button id="print" type="button">🖨 طباعة / حفظ PDF</button><a href="/ar/">رجوع للمتجر</a></nav>
<main class="wrap" id="program"><p class="msg">جاري تجهيز البرنامج…</p></main>
<script>
(() => {
  const box = document.getElementById("program");
  let data;
  try { data = JSON.parse(localStorage.getItem("ko_pb_print") || "null"); } catch (e) {}
  if (!data || typeof data.html !== "string" || !data.html) {
    box.innerHTML = '<div class="msg"><b>ما لقينا برنامج جاهز للطباعة.</b><br>ارجع للمتجر واعمل برنامجك من جديد.</div>';
  } else {
    box.innerHTML = data.html;
    document.getElementById("print").addEventListener("click", () => {
      try {
        if (typeof window.print !== "function") throw new Error("print unavailable");
        window.print();
      } catch (e) {
        alert("الطباعة مو مدعومة بهالمتصفح. افتح الصفحة بكروم واختار طباعة أو حفظ PDF من القائمة.");
      }
    });
  }
})();
</script>
</body>
</html>
