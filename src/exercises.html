<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- يوتيوب بدها Referer وإلا بتطلع Error 153 (الموقع بيبعت سياسة مشددة بالهيدر)، فهون منرجّعها للعادي -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>مكتبة التمارين | KO SPORT</title>
<script>try{var t=localStorage.getItem("ko_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
/* مكتبة التمارين (صاحب المتجر 17 تشرين التاني 2026): بيانات Free Exercise DB المفتوحة، بهوية المتجر ووضع ليلي من ko_theme */
:root{--bg:#ffffff;--ink:#100f14;--muted:#5f5c56;--line:#e4e0d8;--card:#ffffff;--card2:#f7f5f0;
  --gold:#c9a45c;--gold2:#a8843f;--goldbg:#fbf6ea;--btn:#100f14;--btnfg:#ffffff;--r:14px;
  --shadow:0 1px 0 rgba(201,164,92,.3) inset,0 14px 34px -18px rgba(0,0,0,.35);color-scheme:light}
html[data-theme=dark]{--bg:#0f0f12;--ink:#f2f2f5;--muted:#a4a4af;--line:#2c2c34;--card:#1a1a20;--card2:#22222a;
  --goldbg:#2a2416;--btn:#f2f2f5;--btnfg:#100f14;--shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
header{margin:2px 0 14px}
.eyebrow{display:inline-block;background:var(--goldbg);color:var(--gold2);border:1px solid var(--gold);border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:700;margin-bottom:8px}
h1{font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.3}
h1 span{color:var(--gold2)}
header p{color:var(--muted);font-size:.9rem;margin-top:4px}
.search{display:block;width:100%;max-width:520px;margin:10px 0 4px;padding:11px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;outline:none;font-family:inherit}
.search:focus{border-color:var(--gold)}
.sec-title{font-size:.8rem;color:var(--muted);font-weight:700;margin:14px 0 7px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:99px;
  font-size:.9rem;cursor:pointer;font-family:inherit;font-weight:600;transition:.15s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.chip.sub{font-size:.8rem;padding:6px 12px;background:var(--goldbg);border-color:var(--gold);color:var(--gold2)}
.chip.sub.on{background:var(--gold2);color:#fff;border-color:var(--gold2)}
#subs{margin-top:8px}
#subs:empty{display:none}
.status{color:var(--muted);margin:16px 0 4px;font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.media{position:relative;aspect-ratio:4/3;background:#fff;overflow:hidden;border-bottom:1px solid var(--line)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* الصورة التانية بتظهر وبتختفي بنعومة فوق الأولى (متل فيديو)، وبتمشي بس وهي ظاهرة عالشاشة */
.media img.b{opacity:0;will-change:opacity;animation:xf 1.2s cubic-bezier(.45,0,.55,1) infinite alternate;animation-play-state:paused}
.media.play img.b{animation-play-state:running}
@keyframes xf{0%,10%{opacity:0}90%,100%{opacity:1}}
.lvl{position:absolute;top:8px;right:8px;background:var(--goldbg);color:var(--gold2);border:1px solid var(--gold);font-size:.72rem;font-weight:700;
  padding:2px 10px;border-radius:99px;z-index:2}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-size:1rem;font-weight:800;direction:ltr;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;background:var(--card2);border-radius:8px;padding:2px 8px;color:var(--muted)}
.tag.g{background:var(--goldbg);color:var(--gold2);font-weight:700}
details{margin-top:auto}
summary{cursor:pointer;color:var(--gold2);font-size:.88rem;font-weight:700}
ol{direction:ltr;text-align:left;padding-left:20px;margin-top:8px;font-size:.82rem;color:var(--muted)}
ol li{margin-bottom:5px}
.more{display:block;margin:22px auto 0;background:var(--btn);border:0;color:var(--btnfg);
  padding:11px 30px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit}
/* المجسّم (مرسوم خاص بالمتجر): قدّام وورا، كبسة عالعضلة بتفلتر التمارين */
.bmap{display:flex;justify-content:center;gap:4px;margin:6px auto 2px;max-width:440px}
.bmap figure{flex:1;text-align:center;max-width:210px}
.bmap figcaption{font-size:.75rem;color:var(--muted);font-weight:700;margin-top:2px}
.bmap svg{width:100%;height:auto;display:block;max-height:52vh}
.bmap .sil{fill:var(--sk)}
.bmap .mu{fill:var(--mu);stroke:var(--bg);stroke-width:1.2;cursor:pointer;transition:fill .15s}
.bmap .mu:hover{fill:var(--gold)}
.bmap .mu.on{fill:var(--gold2)}
.bmap-hint{text-align:center;font-size:.85rem;font-weight:700;color:var(--gold2);min-height:1.4em;margin-bottom:4px}
:root{--sk:#ebe6dc;--mu:#cfc6b5}
html[data-theme=dark]{--sk:#26262e;--mu:#3a3a45}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.yt,.shop{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.8rem;font-weight:700;border-radius:10px;padding:7px 11px}
.yt{background:var(--btn);color:var(--btnfg)}
.yt i{display:inline-block;width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #e02424}
button.yt{border:0;cursor:pointer;font-family:inherit}
button.yt:disabled{opacity:.6;cursor:default}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:3}
.ytmsg{font-size:.75rem;color:var(--muted)}
.ytmsg a{color:var(--gold2);font-weight:700}
.shop{background:var(--goldbg);color:var(--gold2);border:1px solid var(--gold)}
.credit{text-align:center;color:var(--muted);font-size:.72rem;margin-top:28px}
.credit a{color:var(--gold2)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="eyebrow">أكتر من 800 تمرين</span>
  <h1>مكتبة <span>التمارين</span></h1>
  <p>اكبس على العضلة بالمجسّم أو اختار الأداة، وشوف الحركة الصحيحة لكل تمرين</p>
</header>
  <input class="search" id="q" type="search" placeholder="ابحث باسم التمرين (بالإنكليزي)…">

  <div class="sec-title">اكبس على العضلة بالمجسّم</div>
  <div class="bmap" id="bmap"></div>
  <div class="bmap-hint" id="bhint">اكبس على أي عضلة لتشوف تمريناتها</div>

  <div class="sec-title">العضلة</div>
  <div class="chips" id="groups"></div>
  <div class="chips" id="subs"></div>

  <div class="sec-title">الأداة الرياضية</div>
  <div class="chips" id="equip"></div>

  <div class="status" id="status">جاري تحميل التمارين…</div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>عرض المزيد</button>

  <p class="credit">بيانات التمارين من قاعدة <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">Free Exercise DB</a> المفتوحة المصدر</p>
</div>

<script>
(function(){
  const DATA_URL = "/exdb/exercises.json"; // عن طريق سيرفر المتجر (_worker.js) لأن raw.githubusercontent.com ممكن يكون محجوب عالموبايل
  const IMG_BASE = "/exdb/img/";
  const PAGE = 24;

  // أسماء العضلات بالعربي
  const MUSCLE_AR = {
    "chest":"الصدر","lats":"الظهر العريض","middle back":"منتصف الظهر","lower back":"أسفل الظهر",
    "traps":"الترابيس","shoulders":"الأكتاف","biceps":"البايسبس","triceps":"الترايسبس",
    "forearms":"الساعد","quadriceps":"الفخذ الأمامي","hamstrings":"الفخذ الخلفي","calves":"السمانة",
    "glutes":"المؤخرة","adductors":"الفخذ الداخلي","abductors":"الفخذ الخارجي",
    "abdominals":"البطن","neck":"الرقبة"
  };
  // المجموعات الرئيسية
  const GROUPS = [
    {key:"all",   ar:"الكل",    m:[]},
    {key:"chest", ar:"الصدر",   m:["chest"]},
    {key:"back",  ar:"الظهر",   m:["lats","middle back","lower back","traps"]},
    {key:"shoul", ar:"الأكتاف", m:["shoulders"]},
    {key:"arms",  ar:"الذراعين",m:["biceps","triceps","forearms"]},
    {key:"legs",  ar:"الأرجل",  m:["quadriceps","hamstrings","calves","glutes","adductors","abductors"]},
    {key:"abs",   ar:"البطن",   m:["abdominals"]},
    {key:"neck",  ar:"الرقبة",  m:["neck"]}
  ];
  // الأدوات بالعربي
  const EQUIP_AR = {
    "body only":"وزن الجسم","dumbbell":"دمبل","barbell":"بار حديد","kettlebells":"كيتل بيل",
    "cable":"كابلات","machine":"جهاز","bands":"حبال مقاومة","medicine ball":"كرة طبية",
    "exercise ball":"كرة سويسرية","e-z curl bar":"بار زد","foam roll":"رول مساج","other":"أدوات أخرى"
  };
  // كلمة البحث بالمتجر لكل أداة (زر «جيبها من المتجر»)
  const EQUIP_SHOP = {"dumbbell":"دمبل","barbell":"بار","kettlebells":"كيتل","bands":"مطاط","medicine ball":"كرة طبية",
    "exercise ball":"كرة","e-z curl bar":"بار","foam roll":"رول","cable":"حبل"};

  // ===== المجسّم: رسمة خاصة بالمتجر (نص يمين وبينعكس للشمال) =====
  const MIR = 'transform="translate(200 0) scale(-1 1)"';
  const SIL = '<ellipse cx="100" cy="27" rx="16" ry="20"/>' + ['M100 44 L108 44 L110 60 Q128 63 140 67 Q157 70 161 88 Q166 118 164 150 Q170 180 168 212 Q171 228 165 236 Q157 239 154 228 L151 214 Q145 182 146 154 Q141 128 142 108 Q140 158 137 206 Q143 250 136 300 Q133 322 132 336 Q136 370 129 404 L133 420 Q122 425 110 422 Q110 410 112 404 Q104 370 108 336 Q102 300 101 262 L100 262 Z']
    .map(d => `<path d="${d}"/><path d="${d}" ${MIR}/>`).join("");
  const SHOULDER = 'M131 67 Q149 65 155 80 Q158 95 150 104 Q143 91 133 83 Q129 74 131 67 Z';
  const FOREARM = 'M152 153 Q163 160 165 180 Q165 198 160 212 L152 213 Q148 190 148 170 Z';
  const NECK = 'M93 46 L107 46 L109 62 L91 62 Z';
  const BODY = {
    front: [
      ["neck", NECK, 0], ["traps", "M109 58 Q120 62 131 67 L110 68 Z"], ["shoulders", SHOULDER],
      ["chest", "M102 71 L131 69 Q144 84 140 106 Q122 116 102 110 Z"],
      ["biceps", "M145 106 Q157 108 159 124 Q159 141 152 149 Q144 139 144 121 Z"], ["forearms", FOREARM],
      ["abdominals", "M87 114 L113 114 Q116 158 112 196 L88 196 Q84 158 87 114 Z", 0],
      ["abdominals", "M116 116 Q131 120 134 150 Q132 180 117 196 Q120 158 116 116 Z"],
      ["abductors", "M133 208 Q143 220 141 250 L135 252 Q135 230 129 213 Z"],
      ["quadriceps", "M104 214 Q129 209 135 236 Q139 280 127 320 L110 320 Q102 270 104 214 Z"],
      ["adductors", "M101 215 L110 217 Q108 250 106 282 L101 282 Z"],
      ["calves", "M112 336 Q127 334 129 360 Q129 388 121 402 L114 402 Q108 368 112 336 Z"]
    ],
    back: [
      ["neck", NECK, 0], ["traps", "M100 50 L113 60 L133 69 L114 80 L100 122 L86 80 L67 69 L87 60 Z", 0], ["shoulders", SHOULDER],
      ["triceps", "M145 104 Q159 110 159 128 Q157 145 150 149 Q142 135 144 116 Z"], ["forearms", FOREARM],
      ["lats", "M114 84 Q134 83 140 104 Q136 140 116 172 Q108 140 110 102 Z"],
      ["middle back", "M102 122 L111 98 Q114 128 108 156 L102 156 Z"],
      ["lower back", "M101 160 L110 160 Q114 178 112 198 L101 200 Z"],
      ["glutes", "M101 206 Q129 202 137 224 Q139 248 120 256 Q104 254 101 240 Z"],
      ["hamstrings", "M104 260 Q125 258 133 276 Q137 300 127 322 L110 322 Q102 290 104 260 Z"],
      ["calves", "M112 332 Q131 336 131 360 Q129 384 121 398 L114 398 Q106 366 112 332 Z"]
    ]
  };
  function buildMap(){
    const out = [["front","قدّام"],["back","ورا"]].map(([v, label]) => {
      const mus = BODY[v].map(([m, d, mirror]) => {
        const t = `<title>${MUSCLE_AR[m]||m}</title>`;
        return `<path class="mu" data-m="${m}" d="${d}">${t}</path>` + (mirror === 0 ? "" : `<path class="mu" data-m="${m}" d="${d}" ${MIR}>${t}</path>`);
      }).join("");
      return `<figure><svg viewBox="0 0 200 430" role="img" aria-label="مجسّم العضلات - ${label}"><g class="sil">${SIL}</g>${mus}</svg><figcaption>${label}</figcaption></figure>`;
    }).join("");
    const box = $("bmap");
    box.innerHTML = out;
    box.addEventListener("click", e => {
      const p = e.target.closest(".mu"); if (!p) return;
      const m = p.getAttribute("data-m");
      const grp = GROUPS.find(g => g.m.includes(m));
      state.group = grp ? grp.key : "all";
      state.muscle = grp && grp.m.length > 1 ? m : null;
      update();
      $("status").scrollIntoView({behavior:"smooth", block:"start"});
    });
    box.addEventListener("mouseover", e => {
      const p = e.target.closest(".mu"); if (p) $("bhint").textContent = MUSCLE_AR[p.getAttribute("data-m")] || "";
    });
    box.addEventListener("mouseleave", paintMap);
  }
  function paintMap(){
    const grp = GROUPS.find(x => x.key===state.group);
    const sel = state.muscle ? [state.muscle] : (grp ? grp.m : []);
    document.querySelectorAll("#bmap .mu").forEach(p => p.classList.toggle("on", sel.includes(p.getAttribute("data-m"))));
    $("bhint").textContent = sel.length ? "تمارين: " + (state.muscle ? (MUSCLE_AR[state.muscle]||state.muscle) : grp.ar) : "اكبس على أي عضلة لتشوف تمريناتها";
  }

  const LEVEL_AR = {"beginner":"مبتدئ","intermediate":"متوسط","expert":"محترف"};

  const $ = id => document.getElementById(id);
  let all = [], list = [], shown = 0;
  let state = {group:"all", muscle:null, equip:null, q:""};

  function chip(text, on, onClick, cls){
    const b = document.createElement("button");
    b.className = "chip" + (cls ? " "+cls : "") + (on ? " on" : "");
    b.textContent = text;
    b.onclick = onClick;
    return b;
  }

  function renderFilters(){
    const g = $("groups"); g.innerHTML = "";
    GROUPS.forEach(x => g.appendChild(chip(x.ar, state.group===x.key, () => {
      state.group = x.key; state.muscle = null; update();
    })));

    const s = $("subs"); s.innerHTML = "";
    const grp = GROUPS.find(x => x.key===state.group);
    if (grp && grp.m.length > 1){
      s.appendChild(chip("كل "+grp.ar, !state.muscle, () => { state.muscle=null; update(); }, "sub"));
      grp.m.forEach(m => s.appendChild(chip(MUSCLE_AR[m]||m, state.muscle===m, () => {
        state.muscle = m; update();
      }, "sub")));
    }

    const e = $("equip"); e.innerHTML = "";
    e.appendChild(chip("كل الأدوات", !state.equip, () => { state.equip=null; update(); }));
    Object.keys(EQUIP_AR).forEach(k => {
      if (!all.some(x => x.equipment===k)) return;
      e.appendChild(chip(EQUIP_AR[k], state.equip===k, () => { state.equip=k; update(); }));
    });
  }

  function filter(){
    const grp = GROUPS.find(x => x.key===state.group);
    const muscles = state.muscle ? [state.muscle] : (grp ? grp.m : []);
    const q = state.q.trim().toLowerCase();
    list = all.filter(x => {
      if (muscles.length && !(x.primaryMuscles||[]).some(m => muscles.includes(m))) return false;
      if (state.equip && x.equipment !== state.equip) return false;
      if (q && !x.name.toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function card(x){
    const imgs = x.images || [];
    const a = imgs[0] ? IMG_BASE + imgs[0] : "";
    const b = imgs[1] ? IMG_BASE + imgs[1] : "";
    const el = document.createElement("div");
    el.className = "card";
    const muscles = (x.primaryMuscles||[]).map(m => `<span class="tag g">${MUSCLE_AR[m]||m}</span>`).join("");
    const sec = (x.secondaryMuscles||[]).map(m => `<span class="tag">${MUSCLE_AR[m]||m}</span>`).join("");
    const eq = x.equipment ? `<span class="tag">🏋️ ${EQUIP_AR[x.equipment]||x.equipment}</span>` : "";
    const steps = (x.instructions||[]).map(t => `<li>${esc(t)}</li>`).join("");
    el.innerHTML = `
      <div class="media" ${b ? 'data-anim="1"' : ''}>
        ${x.level ? `<span class="lvl">${LEVEL_AR[x.level]||x.level}</span>` : ""}
        ${a ? `<img class="a" src="${a}" alt="${esc(x.name)}" loading="lazy" decoding="async">` : ""}
        ${b ? `<img class="b" src="${b}" alt="" loading="lazy" decoding="async">` : ""}
      </div>
      <div class="body">
        <div class="name">${esc(x.name)}</div>
        <div class="tags">${muscles}${sec}${eq}</div>
        <div class="acts">
          <button class="yt" type="button" data-n="${esc(x.name)}"><i></i>شوف الفيديو</button>
          ${EQUIP_SHOP[x.equipment] ? `<a class="shop" href="/#/search/${encodeURIComponent(EQUIP_SHOP[x.equipment])}" target="_top">🛒 ${EQUIP_AR[x.equipment]} من المتجر</a>` : ""}
        </div>
        ${steps ? `<details><summary>طريقة التمرين</summary><ol>${steps}</ol></details>` : ""}
      </div>`;
    return el;
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // التحريك فقط للبطاقات الظاهرة على الشاشة (أسرع)
  const io = "IntersectionObserver" in window ? new IntersectionObserver(ents => {
    ents.forEach(en => en.target.classList.toggle("play", en.isIntersecting));
  }, {rootMargin:"100px"}) : null;

  function showMore(){
    const grid = $("grid");
    const frag = document.createDocumentFragment();
    list.slice(shown, shown+PAGE).forEach(x => {
      const c = card(x);
      const m = c.querySelector('.media[data-anim]');
      if (m){ io ? io.observe(m) : m.classList.add("play"); }
      frag.appendChild(c);
    });
    grid.appendChild(frag);
    shown = Math.min(shown+PAGE, list.length);
    $("more").hidden = shown >= list.length;
  }

  function update(){
    renderFilters();
    paintMap();
    filter();
    if (io) io.disconnect();
    $("grid").innerHTML = ""; shown = 0;
    $("status").textContent = list.length ? `عدد التمارين: ${list.length}` : "ما في تمارين بهالاختيار";
    showMore();
  }

  // فيديو يوتيوب قصير جوّا البطاقة: أول 20 ثانية بس، بيعيد لحالو بلا صوت متل الـ GIF.
  // إذا صاحب الفيديو مانع تشغيلو برّا يوتيوب (خطأ 150/101/100) منبلّغ السيرفر وبيعطينا يلي بعدو.
  const ytSearch = n => "https://www.youtube.com/results?search_query=" + encodeURIComponent(n + " exercise");
  let ytApi = null;
  function loadYT(){
    if (ytApi) return ytApi;
    ytApi = new Promise(res => {
      if (window.YT && window.YT.Player) return res(window.YT);
      window.onYouTubeIframeAPIReady = () => res(window.YT);
      const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
    });
    return ytApi;
  }
  const ytQ = (n, bad) => fetch("/exdb/yt?n=" + encodeURIComponent(n) + (bad ? "&bad=" + encodeURIComponent(bad) : "")).then(r => r.json()).catch(() => ({}));
  function ytFail(card, b, n, pending){
    const old = card.querySelector(".ytmsg"); if (old) old.remove();
    const msg = pending ? "الفيديو لسا عم يتجهّز لهالتمرين." : "ما لقينا فيديو قصير لهالتمرين.";
    const html = `<span class="ytmsg">${msg} <a href="${ytSearch(n)}" target="_blank" rel="noopener">افتح يوتيوب</a></span>`;
    if (b && b.isConnected){ b.disabled = false; b.lastChild.textContent = "شوف الفيديو"; b.insertAdjacentHTML("afterend", html); }
    else card.querySelector(".body .tags").insertAdjacentHTML("afterend", html);
  }
  async function ytPlay(card, b, n, r, tries){
    const media = card.querySelector(".media");
    const YT = await loadYT();
    const box = document.createElement("div"); media.appendChild(box);
    const vars = {autoplay:1, mute:1, loop:1, playlist:r.id, controls:0, playsinline:1, rel:0, modestbranding:1};
    if (r.d > 20) vars.end = 20;
    new YT.Player(box, {
      videoId: r.id, host: "https://www.youtube-nocookie.com", playerVars: vars,
      events: {
        onReady: e => { e.target.mute(); e.target.playVideo(); if (b && b.isConnected) b.remove(); },
        onError: async e => {
          const f = media.querySelector("iframe"); if (f) f.remove();
          if ([100, 101, 150, 153].includes(e.data) && tries < 5){
            const nx = await ytQ(n, r.id);
            if (nx.id) return ytPlay(card, b, n, nx, tries + 1);
          }
          ytFail(card, b, n, false);
        }
      }
    });
  }
  $("grid").addEventListener("click", async e => {
    const b = e.target.closest("button.yt"); if (!b) return;
    const card = b.closest(".card"), n = b.getAttribute("data-n");
    const old = card.querySelector(".ytmsg"); if (old) old.remove();
    b.disabled = true; b.lastChild.textContent = "عم يحمّل…";
    const r = await ytQ(n);
    if (r.id) ytPlay(card, b, n, r, 0); else ytFail(card, b, n, !!r.pending);
  });

  buildMap();
  $("more").onclick = showMore;
  let t; $("q").oninput = e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 250); };

  fetch(DATA_URL).then(r => { if(!r.ok) throw 0; return r.json(); }).then(d => {
    all = d; update();
  }).catch(() => {
    $("status").textContent = "صار في مشكلة بتحميل التمارين، جرّب تحدّث الصفحة.";
  });
})();
</script>
</body>
</html>
