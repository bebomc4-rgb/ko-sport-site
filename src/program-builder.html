.top .back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink);text-decoration:none}
.top .back:hover{background:var(--card2)}
.top .logo{justify-self:center;display:block;height:48px}

.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.ptitle{margin:2px 0 14px}
.ptitle h1{margin:0;font-size:clamp(22px,5vw,28px);font-weight:800;letter-spacing:-.2px}
.ptitle small{display:block;color:var(--mut);font-size:.85rem;font-weight:400}
h2{font-size:1.05rem;margin:18px 2px 8px;font-weight:800}
.card{background:var(--card);border:1px solid rgba(201,164,92,.55);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:1rem;color:var(--gold2)}

.chips button.on{background:var(--btn);color:var(--btnfg);border-color:var(--btn);font-weight:700}
.chips.eq button.on{background:var(--goldbg);color:var(--gold2);border-color:var(--gold)}

.g3 label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:4px}
.g3 input{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:1rem;width:100%;text-align:center}
.g3 input:focus{outline:none;border-color:var(--gold)}
.hint{color:var(--mut);font-size:.78rem;margin:8px 0 0}

.btn.w{width:100%;font-size:1.05rem;padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.bar .btn{flex:1;min-width:130px;text-align:center;padding:10px 12px;font-size:.9rem}

.sum{background:linear-gradient(135deg,var(--goldbg),var(--card) 70%);border:1px solid var(--gold);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}

.cd{color:var(--mut);font-size:.8rem;margin-top:8px}

const PR={mus:{c:[4,"6-10",90],i:[3,"10-15",60]},str:{c:[5,"3-5",150],i:[3,"6-8",90]},fat:{c:[3,"10-15",45],i:[3,"12-15",30]},end:{c:[3,"15-20",30],i:[2,"15-20",30]},pow:{c:[4,"3-5",120],i:[3,"8-10",60]},gen:{c:[3,"8-12",60],i:[2,"12-15",45]}};

};
const WD={2:["السبت","الأربعاء"],3:["السبت","الإثنين","الأربعاء"],4:["السبت","الأحد","الأربعاء","الخميس"],5:["السبت","الأحد","الإثنين","الأربعاء","الخميس"],6:["السبت","الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس"]};

const hsh=s=>{let x=2166136261;for(let i=0;i<s.length;i++)x=Math.imul(x^s.charCodeAt(i),16777619);return(x>>>0)%1000/1000};
function goalFin(G,A){
  const base=A.has("bg")?"كيس ملاكمة: 6 جولات × دقيقتين جهد عالي، راحة 45 ثانية":A.has("jr")?"حبل قفز: 10 جولات × (45 ثانية قفز / 15 ثانية راحة)":A.has("kb")?"سوينغ بالكيتل بيل: 10 جولات × (30 ثانية جهد / 30 ثانية راحة)":"8 جولات × (30 ثانية جهد / 30 ثانية راحة): بيربي، قفز سكوات، تسلّق الجبل، رفع الركب";
  return G==="end"?{t:"ختام تحمّل",x:"15 دقيقة كارديو متواصل بإيقاع بتقدر تحكي فيه جملة قصيرة (ركض خفيف، مشي سريع، دراجة) — أو: "+base,m:12}:{t:"ختام حرق دهون",x:base,m:8};
}
function splitFor(I){
  const d=I.days,b=I.lv===0,sp=SP[I.sp],ath=!!sp.pl||["box","mma","run","tn"].includes(I.sp);
  if(d===2)return[DAYS.fbA,DAYS.fbB];
  if(d===3)return(b||ath)?[DAYS.fbA,DAYS.fbB,DAYS.fbC]:[DAYS.push,DAYS.pull,DAYS.legs];
  if(d===4)return[DAYS.up,DAYS.lo,DAYS.upB,DAYS.loB];
  if(d===5)return b?[DAYS.up,DAYS.lo,DAYS.fbC,DAYS.upB,DAYS.loB]:[DAYS.push,DAYS.pull,DAYS.legs,DAYS.up,DAYS.lo];
  return[DAYS.push,DAYS.pull,DAYS.legs,DAYS.push,DAYS.pull,DAYS.legs];
}
function nutri(I){
  const bmr=10*I.w+6.25*I.h-5*I.age+(I.g==="m"?5:-161),tdee=bmr*(1.2+.075*I.days);
  let k=tdee;
  if(I.goal==="mus")k=tdee+(I.lv===0?300:200);
  else if(I.goal==="fat")k=Math.max(tdee*(I.age<18?.9:.82),bmr,I.g==="m"?1500:1200);
  k=Math.round(k/50)*50;
  const pk={mus:1.8,fat:2,str:1.8,pow:1.6,end:1.4,gen:1.5}[I.goal],p=Math.round(I.w*pk),f=Math.round(I.w*.9),c=Math.max(80,Math.round((k-p*4-f*9)/4));
  return{k,p,f,c,water:Math.round((I.w*.035+.5)*10)/10};
}
function gen(I,seed){
  seed=seed||0;
  const lv=I.lv,A=new Set(I.eq),sp=SP[I.sp],G=I.goal,short=I.min<=40;
  const bmi=I.w/((I.h/100)**2),effG=(I.age<16&&G==="str")?"gen":G,maxL=I.age<16?Math.min(lv,1):lv,lowImp=I.age>=50||bmi>=32;
  const has=r=>!r||r.split(",").every(t=>A.has(t));
  const used={},FB={vr:"hr",vp:"hp",hp:"vp",hi:"gl",sq:"lu",lu:"sq",gl:"hi"};
  const sc=e=>{let s=e.l;if(e.r&&["mus","str","pow"].includes(effG))s+=1;if(sp.pref&&sp.pref.test(e.n))s+=2;s-=(used[e.n]||0)*(effG==="str"?.4:1.5);if(seed)s+=hsh(e.n+seed)*1.2;return s};
  function pick(slot,dayUsed){
    const[p0,k]=slot.split(":");
    for(const p of[p0,FB[p0]]){
      if(!p)continue;
      let c=EX.filter(e=>e.p===p&&e.l<=maxL&&has(e.r)&&!dayUsed.has(e.n)&&!(lowImp&&e.k==="p"));
      if(k==="i"){const x=c.filter(e=>e.k==="i");if(x.length)c=x}else{const x=c.filter(e=>e.k==="c");if(x.length)c=x}
      if(!c.length)continue;
      return c.map((e,i)=>[sc(e),-i,e]).sort((a,b)=>b[0]-a[0]||b[1]-a[1])[0][2];
    }
    return null;
  }
  function rx(e){
    if(e.k==="h")return{s:lv?3:2,r:["20-30 ث","30-45 ث","45-60 ث"][lv],rest:45,h:1};
    if(e.k==="p")return e.r==="jr"?{s:3,r:"60 ث",rest:45,h:1}:{s:lv?4:3,r:lv?"5-6":"4-5",rest:75};
    let[s,r,rest]=PR[effG][e.k==="c"?"c":"i"];
    if(e.k==="c"&&lv===0){s=Math.min(s,3);if(effG==="str"){r="5-8";rest=120}if(effG==="pow")r="5-6"}
    if(short){s=Math.min(s,e.k==="c"?3:2);rest=Math.round(rest*.75)}
    if(I.age>=50)rest+=15;
    return{s,r,rest};
  }
  const est=(e,x)=>x.s*((x.h?45:e.k==="p"?20:40)+x.rest)/60+1;
  const split=splitFor(I),warm=short?5:8,days=[];
  split.forEach((tp,di)=>{
    const dayUsed=new Set(),rows=[];
    let slots=tp.s.slice();
    if((tp.ty==="lo"||tp.ty==="fb")&&(sp.pl||G==="pow"))slots.unshift("pl");
    if(sp.more&&lv>0)slots=slots.concat(sp.more);
    const last=di>=split.length-2,sf=sp.fin&&last?sp.fin(A):null;
    let fin=null;
    if(sf)fin={t:"ختام رياضي",x:sf,m:short?6:8};
    else if((G==="fat"||G==="end")&&(split.length<=3||di%2===0)){fin=goalFin(G,A);if(short)fin.m=Math.min(fin.m,6)}
    const budget=I.min-warm-(short?3:4)-(fin?fin.m:0),maxN=[6,7,8][lv]+(sp.more?1:0);
    let spent=0,n=0;
    for(const sl of slots){
      if(n>=maxN)break;
      const e=pick(sl,dayUsed);if(!e)continue;
      const r=rx(e);let t=est(e,r);
      if(n<3){const allow=Math.max(4,(budget-spent)/(3-n));while(t>allow&&r.s>2){r.s--;t=est(e,r)}while(t>allow&&r.rest>60){r.rest-=15;t=est(e,r)}}
      else if(spent+t>budget)continue;
      dayUsed.add(e.n);used[e.n]=(used[e.n]||0)+1;spent+=t;n++;
      rows.push({n:e.n,q:e.q,u:e.u,k:e.k,s:r.s,r:r.r,rest:r.rest,h:!!r.h,tip:TIP[e.p]||""});
    }
    days.push({t:tp.t,wd:WD[I.days][di],ty:tp.ty,warm:WARM[tp.ty],rows,fin,total:Math.round(warm+(short?3:4)+spent+(fin?fin.m:0))});
  });
  const notes=[];
  notes.push("اختار وزن بيخليك تخلّص التكرارات وبيضل عندك تكرارين أو تلاتة احتياط. الجودة قبل الوزن.");
  notes.push("التقدّم: أسبوع 1 خفيف لتتعلّم الحركة. أسابيع 2 و3 زيد وزن صغير (2.5-5%) أو تكرار. أسبوع 4 خفّف الحجم للنص وارتاح، وبعدها ابدأ دورة جديدة وبدّل التمارين.");
  if(["mus","str","pow"].includes(G))notes.push("نام 7-9 ساعات، والعضلة بتكبر وقت الراحة مو وقت التمرين.");
  if(G==="fat")notes.push("ضيف 2-3 جلسات كارديو خفيف (مشي سريع أو ركض خفيف 25-40 دقيقة) بالأيام الفاضية.");
  if(G==="end")notes.push("ضيف جلستين كارديو متواصل 30-45 دقيقة بالأسبوع، وزيد المدة 5 دقايق كل أسبوع.");
  if(I.lv===0&&I.days>4)notes.push("للمبتدئ: ابدأ بـ 3-4 أيام أول 4 أسابيع، وبعدها زيد إذا جسمك ارتاح منيح.");
  if(I.age<16)notes.push("بعمرك ركّز على التقنية الصح وحمل خفيف أو متوسط، وبلا رفع أقصى. يفضّل تتمرّن بإشراف مدرّب.");
  if(I.age>=50)notes.push("زدنا الراحة بين المجموعات وشلنا القفزات القوية. سخّن أكتر، وإذا عندك مشكلة بالقلب أو المفاصل استشر دكتورك قبل ما تبدأ.");
  if(bmi>=32)notes.push("شلنا القفزات والتمارين القوية عالمفاصل وركّزنا عالحركات الآمنة. ابدأ بالتدريج وزيد الشدّة مع الوقت.");
  (sp.tips||[]).forEach(t=>notes.push(t));
  const lvl=(A.has("mc")||(A.has("bb")&&A.has("bn")))?0:1;
  const shop=[];
  if(!A.has("mc")){[["db","دمبل"],["bd","حبل مقاومة"],["pu","عقلة"],["jr","حبل قفز"],["kb","كيتل بيل"]].forEach(([t,w])=>{if(!A.has(t)&&shop.length<4)shop.push(w)});
    if(["box","mma"].includes(I.sp)&&!A.has("bg")&&shop.length<4)shop.push("كيس ملاكمة")}
  const b=Math.round(bmi*10)/10,bc=b<18.5?"نحيف":b<25?"طبيعي":b<30?"زيادة وزن":"سمنة";
  return{days,notes,nu:nutri(I),bmi:b,bmiC:bc,shop:lvl?shop:[],G,sp:sp.n,lv:LVN[lv],split:split.length};
}

    const r=R,N=r.nu;
    app.innerHTML=`<div class="sum"><b>برنامجك جاهز 💪</b>
      <div class="tags"><span class="tag">${esc(r.sp)}</span><span class="tag">${esc(GOALN[r.G])}</span><span class="tag">${esc(r.lv)}</span><span class="tag">${num(S.days)} أيام بالأسبوع</span><span class="tag">${num(S.min)} دقيقة</span></div></div>
    <div class="bar noprint"><button class="btn" id="re">🔀 نسخة تانية</button><button class="btn ghost" id="pr">🖨 طباعة / PDF</button><button class="btn ghost" id="cp">📋 انسخ كنص</button><button class="btn ghost" id="ed">✏️ عدّل إجاباتي</button></div>
    ${r.days.map((d,i)=>`<div class="card dy"><div class="hd"><b>اليوم ${num(i+1)} · ${esc(d.wd)} · ${esc(d.t)}</b><span>حوالي ${num(d.total)} د</span></div>
      <div class="wu">🔥 تسخين: ${esc(d.warm)}</div>
      ${d.rows.map(x=>`<div class="ex" data-q="${esc(x.q||"")}"><div class="n">${esc(x.n)}${x.u?`<em>لكل جهة</em>`:""}</div><div class="p"><b>${num(x.s)} × ${num(x.r)}${x.h?"":" تكرار"}</b><span>راحة ${rest(x.rest)}</span></div>${x.tip?`<div class="t">${esc(x.tip)}</div>`:""}</div>`).join("")}
      ${d.fin?`<div class="fin"><b>${esc(d.fin.t)} (${num(d.fin.m)} د):</b> ${esc(d.fin.x)}</div>`:""}
      <div class="cd">🧘 تبريد: مشي خفيف وإطالة للعضلات يلي اشتغلت (20-30 ثانية لكل عضلة)</div></div>`).join("")}
    <div class="card"><h3>🍽 تغذيتك (تقدير تقريبي)</h3><div class="nu"><div><b>${num(N.k)}</b><small>سعرة باليوم</small></div><div><b>${num(N.p)}</b><small>غ بروتين</small></div><div><b>${num(N.c)}</b><small>غ كربوهيدرات</small></div><div><b>${num(N.f)}</b><small>غ دهون</small></div></div>
      <p class="hint">مؤشر كتلة الجسم عندك ${num(r.bmi)} (${esc(r.bmiC)}). المي: حوالي ${num(N.water)} ليتر باليوم. الأرقام تقديرية (±10%): تابع وزنك كل أسبوعين وعدّل حسب النتيجة.</p></div>
    <div class="card"><h3>📌 ملاحظات</h3><ul class="nt">${r.notes.concat(CFG.note?[CFG.note]:[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    ${r.shop.length?`<div class="card noprint"><h3>🛒 جهّز أدواتك من المتجر</h3><div class="shop">${r.shop.map(w=>`<a href="/#/search/${encodeURIComponent(w)}" target="_top">${esc(w)}</a>`).join("")}</div></div>`:""}
    <p class="hint">هالبرنامج إرشادي عام، مو بديل عن مدرّب أو دكتور. إذا عندك إصابة أو مرض، استشر دكتورك قبل ما تبدأ، ووقّف فوراً إذا حسّيت بألم حاد.</p>`;
    window.scrollTo({top:0});
    media();
  }
  // صور وفيديوهات التمارين من مكتبة صاحب المتجر: بتظهر لحسابو بس (حقوق الملفات)، وغيرو ما بيشوف شي ولا بيتغيّر عندو شي
  let LIB=null;
  async function lib(){
    if(LIB!==null)return LIB;LIB=[];
    try{const a=JSON.parse(localStorage.getItem("ko_acct")||"null");if(!(a&&a.token))return LIB;
      const r=await fetch("/api/exlib/list",{headers:{authorization:"Bearer "+a.token},credentials:"same-origin"});
      if(r.ok)LIB=(await r.json()).filter(x=>x.m!=="Other").map(x=>({i:x.i,v:x.v,n:String(x.n||"").toLowerCase()}));}catch(e){}
    return LIB;
  }
  function find(q){
    for(const alt of q.split("|")){
      const t=alt.trim().toLowerCase().split(/\s+/).filter(Boolean);if(!t.length)continue;
      let best=null,bs=1e9;
      for(const x of LIB){if(!t.every(w=>x.n.includes(w)))continue;const sc=x.n.length-(x.v?40:0);if(sc<bs){bs=sc;best=x}}
      if(best)return best;
    }
    return null;
  }
  let MIO=null;
  // الفيديو بيظهر بس وهو شغّال (قبلها مربع أبيض، بلا علامة التشغيل الرمادية)
  document.addEventListener("playing",e=>{if(e.target&&e.target.tagName==="VIDEO")e.target.classList.add("on")},true);
  async function media(){
    if(CFG.media===false)return;
    await lib();if(!LIB.length)return;
    if(MIO)MIO.disconnect();
    // الفيديو بيتحمّل ويشتغل بس وهو ظاهر عالشاشة (26 فيديو مرة وحدة كانو يعلّقو اللمس)
    const run=[];const stop=v=>{try{v.pause()}catch(e){}const k=run.indexOf(v);if(k>=0)run.splice(k,1)};
    MIO=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){if(!v.src)v.src=v.dataset.src;v.defaultPlaybackRate=v.playbackRate=+CFG.speed||1.5;const k=run.indexOf(v);if(k>=0)run.splice(k,1);run.push(v);while(run.length>3)stop(run[0]);v.play().catch(()=>{})}else stop(v)}),{rootMargin:"150px",threshold:.2});
    document.querySelectorAll(".ex[data-q]").forEach(el=>{
      const q=el.dataset.q;if(!q)return;const x=find(q);if(!x)return;
      const m=x.v?`<video class="xm" data-src="/exlib/m/${x.i}.mp4" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" muted loop playsinline disablepictureinpicture preload="none"></video>`:`<img class="xm" src="/exlib/m/${x.i}.jpg" alt="" loading="lazy" decoding="async">`;
      el.insertAdjacentHTML("afterbegin",`<div class="xmw noprint">${m}</div>`);
      const v=el.querySelector("video");if(v)MIO.observe(v);
    });
  }
  function asText(){
    const r=R,L=[`برنامجي من KO SPORT — ${r.sp} · ${GOALN[r.G]} · ${r.lv}`,""];
    r.days.forEach((d,i)=>{L.push(`اليوم ${i+1} (${d.wd}) — ${d.t}`,`تسخين: ${d.warm}`);d.rows.forEach(x=>L.push(`• ${x.n}${x.u?" (لكل جهة)":""}: ${x.s} × ${x.r}${x.h?"":" تكرار"} · راحة ${x.rest} ث`));if(d.fin)L.push(`${d.fin.t}: ${d.fin.x}`);L.push("")});
    const N=r.nu;L.push(`التغذية: ${N.k} سعرة · ${N.p}غ بروتين · ${N.c}غ كربوهيدرات · ${N.f}غ دهون · مي ${N.water} ل`,"",...r.notes.map(t=>"- "+t));
    return L.join("\n");
  }
  function printProgram(){
    if(!R){toast("اعمل برنامجك أول شي");return}
    const copy=document.querySelector(".wrap").cloneNode(true);
    copy.querySelectorAll(".noprint,video,button").forEach(x=>x.remove());
    const data=JSON.stringify({html:copy.innerHTML});
    try{localStorage.setItem("ko_pb_print",data)}catch(e){}
    const url="/program-print.html?v=403#"+encodeURIComponent(data);
    try{window.top.location.assign(url)}
    catch(e){location.assign(url)}
  }
  app.addEventListener("input",e=>{const t=e.target;if(t.id==="i_age")S.age=t.value;if(t.id==="i_h")S.h=t.value;if(t.id==="i_w")S.w=t.value;save()});
  app.addEventListener("click",async e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.k){const k=b.dataset.k,v=b.dataset.v;
      if(k==="eq"){const i=S.eq.indexOf(v);i<0?S.eq.push(v):S.eq.splice(i,1);b.classList.toggle("on")}
      else{S[k]=["lv","days","min"].includes(k)?+v:v;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}
      save();return}
    if(b.id==="go"){const m=chk();if(m){form(m);window.scrollTo({top:0});return}seed=0;I={...S,age:+S.age,h:+S.h,w:+S.w};R=gen(I,seed);show();return}
    if(b.id==="re"){seed++;R=gen(I,seed);show();toast("هي نسخة تانية بتمارين مختلفة");return}
    if(b.id==="ed"){form();return}
    if(b.id==="pr"){printProgram();return}
    if(b.id==="cp"){const t=asText();try{await navigator.clipboard.writeText(t);toast("اننسخ البرنامج ✓")}catch{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("اننسخ البرنامج ✓")}catch{toast("ما زبط النسخ")}a.remove()}}
  });
  form();loadCfg();
})();
</script>
