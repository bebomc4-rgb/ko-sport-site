  app.addEventListener("input",e=>{const t=e.target;if(t.id==="i_age")S.age=t.value;if(t.id==="i_h")S.h=t.value;if(t.id==="i_w")S.w=t.value;save()});
  app.addEventListener("click",async e=>{
    const z=e.target.closest("[data-zoom]");if(z){const v=z.querySelector("video"),src=v?(v.dataset.src||v.src):z.querySelector("img").src;const o=document.createElement("div");o.className="zoom";o.innerHTML=v?`<video src="${src}" autoplay muted loop playsinline></video>`:`<img src="${src}" alt="">`;o.onclick=()=>o.remove();document.body.appendChild(o);return}
    if(e.target.closest("#pdfd"))toast("عم ينزل الملف… شوفو بالتنزيلات");
    const b=e.target.closest("button");if(!b)return;
    if(b.id==="pdfb"){show();return}
    if(b.id==="pdfs"){sharePdf();return}
    if(b.dataset.day!=null){DAY=+b.dataset.day;app.querySelectorAll(".dtab").forEach(t=>t.classList.toggle("on",t===b));app.querySelectorAll("[data-dy]").forEach(x=>x.hidden=+x.dataset.dy!==DAY);return}
    if(b.dataset.k){const k=b.dataset.k,v=b.dataset.v;
      if(k==="eq"){const i=S.eq.indexOf(v);i<0?S.eq.push(v):S.eq.splice(i,1);b.classList.toggle("on");const q=$("#eqs");if(q)q.textContent=eqLine()}
      else{S[k]=["lv","days","min"].includes(k)?+v:v;b.parentNode.querySelectorAll(".opt,button").forEach(x=>x.classList.toggle("on",x===b))}
      if(k==="pl"){const h=$("#eqh");if(h)h.hidden=S.pl!=="home";if(S.pl==="home")0}
      {const er=app.querySelector(".err");if(er)er.remove()}
      save();return}
    if(b.hasAttribute("data-eq0")){S.eq=[];document.querySelectorAll('.opt[data-k="eq"]').forEach(x=>x.classList.remove("on"));const q=$("#eqs");if(q)q.textContent=eqLine();save();toast("تمام: البرنامج بوزن الجسم بس");return}
    if(b.id==="wn"){const m=stepErr(STEPS[step]);if(m){form(m);return}step++;form();toTop();return}
    if(b.id==="wb"){step=Math.max(0,step-1);form();toTop();return}
    if(b.dataset.st!=null){step=+b.dataset.st;form();toTop();return}
    if(b.id==="go"){for(let j=0;j<STEPS.length;j++){const m=stepErr(STEPS[j]);if(m){step=j;form(m);toTop();return}}seed=0;I={...S,age:+S.age,h:+S.h,w:+S.w,eq:eqOf()};DAY=0;R=gen(I,seed);saveR();show();return}
    if(b.id==="re"){seed++;R=gen(I,seed);saveR();show();toast("هي نسخة تانية بتمارين مختلفة");return}
    if(b.id==="ed"){step=0;form();toTop();return}
    if(b.id==="pr"){printProgram();return}
    if(b.id==="cp"){const t=asText();try{await navigator.clipboard.writeText(t);toast("اننسخ البرنامج ✓")}catch{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("اننسخ البرنامج ✓")}catch{toast("ما زبط النسخ")}a.remove()}}
  });
  {let sv=null;try{sv=JSON.parse(localStorage.getItem(RKEY)||"null")}catch(e){}
   if(sv&&sv.R&&sv.R.days){R=sv.R;I=sv.I;seed=sv.seed||0;show()}else form();}
  loadCfg();
})();
</script>
</body>
</html>
