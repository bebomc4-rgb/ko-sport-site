/* Runs before first paint: apply last-known design */
(function () {

  var g = window.__koD || (s && s.design);
  if (g) {
    var st = d.style;
    st.setProperty("--red", g.primary); st.setProperty("--ink", g.dark); st.setProperty("--paper", g.background);

    if (/^[a-z]{3,12}$/.test(g.skin || "")) d.setAttribute("data-skin", g.skin);
    var ph = String(g.primary || "").replace("#", ""); if (ph.length === 6 && (0.2126 * parseInt(ph.slice(0, 2), 16) + 0.7152 * parseInt(ph.slice(2, 4), 16) + 0.0722 * parseInt(ph.slice(4, 6), 16)) / 255 < 0.22) d.setAttribute("data-pri-dark", "");

    var lay = g.layout || {}; for (var q in lay) if (/^[a-z]{1,10}$/.test(q) && /^[a-z]{1,10}$/.test(lay[q])) d.setAttribute("data-l-" + q, lay[q]);
  }
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  d.className += reduce ? " reduce" : " anim";

  if (s && s.design) {
    var g2 = s.design, pref = null; try { pref = localStorage.getItem("ko_theme"); } catch (e) {}
    var dd = g2.darkDefault || "light", can = g2.darkBtn === true || dd !== "light";

})();
